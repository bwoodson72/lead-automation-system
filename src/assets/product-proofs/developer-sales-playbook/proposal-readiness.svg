<text x="88" y="320" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">DIMENSION</text>
<text x="670" y="320" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">STATE</text>
<text x="850" y="320" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#fff">WHAT MAKES IT CLEAR</text>
<g font-family="Georgia, serif" font-size="20" fill="#101820">
<text x="88" y="382">Problem Clarity</text><text x="670" y="382" font-weight="700">Clear</text><text x="850" y="382">Buyer confirms the actual problems and current condition.</text>
<text x="88" y="432">Business Importance</text><text x="670" y="432" font-weight="700">Clear</text><text x="850" y="432">Expansion and paid-search timing create a supported reason to act.</text>
<text x="88" y="482">Solution Fit</text><text x="670" y="482" font-weight="700">Clear</text><text x="850" y="482">Buyer and seller accept the broad solution direction.</text>
<text x="88" y="532">Scope / Delivery Clarity</text><text x="670" y="532" font-weight="700">Clear</text><text x="850" y="532">Responsibilities, exclusions, access, and dependencies are bounded.</text>
<text x="88" y="582">Economic Fit</text><text x="670" y="582" font-weight="700">Clear</text><text x="850" y="582">$9,000–$12,000 territory is workable for the broader obligation.</text>
<text x="88" y="632">Decision Authority</text><text x="670" y="632" font-weight="700">Clear</text><text x="850" y="632">Eric is directly involved and owns the spend decision.</text>
<text x="88" y="682">Stakeholder Clarity</text><text x="670" y="682" font-weight="700">Clear</text><text x="850" y="682">Material users, influencers, and dependencies are represented.</text>
<text x="88" y="732">Timing / Decision Process</text><text x="670" y="732" font-weight="700">Clear</text><text x="850" y="732">Decision path, milestones, and launch timing are understood.</text>
<text x="88" y="782">Mutual Commitment</text><text x="670" y="782" font-weight="700">Clear</text><text x="850" y="782">Both sides completed meaningful pre-proposal commitments.</text>
</g>
<rect x="64" y="836" width="1472" height="202" rx="10" fill="#fff6d8" stroke="#d69e00" stroke-width="2"/>
<text x="92" y="888" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c78d00">MANDATORY FINAL QUESTION</text>
<text x="92" y="936" font-family="Georgia, serif" font-size="22" fill="#101820">What is the most important unresolved condition that could materially change</text>
<text x="92" y="968" font-family="Georgia, serif" font-size="22" fill="#101820">the scope, price, feasibility, or decision?</text>
<text x="92" y="1010" font-family="Georgia, serif" font-size="22" fill="#101820">Summit: no material unresolved condition remains. Photography timing is imperfect but bounded.</text>
<rect x="64" y="1070" width="1472" height="116" rx="10" fill="#edf6ee" stroke="#5f9a73" stroke-width="2"/>
<text x="92" y="1122" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#356b45">OUTCOME: PROPOSAL READY</text>
<text x="92" y="1160" font-family="Georgia, serif" font-size="21" fill="#101820">This does not mean the buyer agreed to purchase. Final scope, price, payment, and proposal belong downstream.</text>
<text x="64" y="1264" font-family="Arial, sans-serif" font-size="18" fill="#7b8791">Faithful current-edition excerpt recomposed for readable web proof.</text>
