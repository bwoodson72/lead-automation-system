<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320"><rect width="1600" height="1320" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">MARKETING FOR BUILDERS · WORKBOOK P. 11</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Proof Ladder</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Move a claim only as far as the evidence actually supports.</text><rect x="72" y="230" width="1456" height="50" rx="6" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">WORKED EXAMPLE · “I BUILD ACCESSIBLE WEBSITES.”</text><g font-family="Georgia,serif" fill="#111820"><g><rect x="72" y="320" width="1456" height="104" rx="8" fill="#f7f8fa" stroke="#ccd3d8"/><text x="98" y="360" font-size="20" font-weight="700">1 · CLAIM</text><text x="340" y="360" font-size="23">I build accessible websites.</text><text x="340" y="397" font-size="19" fill="#68727c">Easy to say. Not yet evidence.</text></g><g><rect x="72" y="442" width="1456" height="104" rx="8" fill="#f7f8fa" stroke="#ccd3d8"/><text x="98" y="482" font-size="20" font-weight="700">2 · EXPLANATION</text><text x="340" y="482" font-size="23">Accessibility is considered during component, content, and QA decisions.</text><text x="340" y="519" font-size="19" fill="#68727c">Explains the approach.</text></g><g><rect x="72" y="564" width="1456" height="104" rx="8" fill="#f7f8fa" stroke="#ccd3d8"/><text x="98" y="604" font-size="20" font-weight="700">3 · DEMONSTRATION</text><text x="340" y="604" font-size="23">Show an accessible component and the testing process.</text><text x="340" y="641" font-size="19" fill="#68727c">Lets the buyer inspect capability.</text></g><g><rect x="72" y="686" width="1456" height="104" rx="8" fill="#f7f8fa" stroke="#ccd3d8"/><text x="98" y="726" font-size="20" font-weight="700">4 · ARTIFACT</text><text x="340" y="726" font-size="23">Publish an audit excerpt or checklist.</text><text x="340" y="763" font-size="19" fill="#68727c">Makes the working method visible.</text></g><g><rect x="72" y="808" width="1456" height="104" rx="8" fill="#fff8e6" stroke="#d6a72a"/><text x="98" y="848" font-size="20" font-weight="700">5 · MEASURED EVIDENCE</text><text x="340" y="848" font-size="23">Show verified before/after findings when available.</text><text x="340" y="885" font-size="19" fill="#68727c">Use numbers only when they were actually measured.</text></g><g><rect x="72" y="930" width="1456" height="104" rx="8" fill="#edf5ee" stroke="#a8c0ad"/><text x="98" y="970" font-size="20" font-weight="700">6 · CLIENT EVIDENCE</text><text x="340" y="970" font-size="23">Client confirms remediation or a practical improvement.</text><text x="340" y="1007" font-size="19" fill="#68727c">Do not manufacture the top rung when it does not exist.</text></g><rect x="72" y="1080" width="1456" height="132" rx="8" fill="#0b1f33"/><text x="100" y="1128" font-size="24" font-weight="700" fill="#ffffff">Operating rule</text><text x="100" y="1172" font-size="23" fill="#d8dee5">Do not ask the buyer to believe what you can show. Do not skip levels by inventing evidence.</text></g><text x="72" y="1268" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>