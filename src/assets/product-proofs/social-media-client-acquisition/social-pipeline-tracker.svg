<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="1600" height="1260" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">SOCIAL MEDIA CLIENT ACQUISITION · WORKSHEET 21</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Social Pipeline Tracker</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Track social influence at the opportunity level instead of treating engagement as the business result.</text><rect x="72" y="230" width="1456" height="50" rx="6" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">FICTIONAL 90-DAY SNAPSHOT · ALEX MORGAN</text><g font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0b1f33"><text x="84" y="345">OPPORTUNITY</text><text x="365" y="345">FIRST KNOWN SOURCE</text><text x="720" y="345">INFLUENTIAL TOUCHPOINTS</text><text x="1240" y="345">STAGE</text></g><g font-family="Georgia,serif" font-size="21" fill="#111820"><line x1="72" y1="380" x2="1528" y2="380" stroke="#d7dce0"/><text x="84" y="435">Professional-services redesign</text><text x="365" y="435">LinkedIn post</text><text x="720" y="435">Profile → case study → website</text><text x="1240" y="435" font-weight="700" fill="#8a6508">PROPOSAL</text><line x1="72" y1="470" x2="1528" y2="470" stroke="#d7dce0"/><text x="84" y="525">Rebrand / site alignment</text><text x="365" y="525">Referral comment thread</text><text x="720" y="525">Profile → proof → DM conversation</text><text x="1240" y="525" font-weight="700" fill="#8a6508">DISCOVERY</text><line x1="72" y1="560" x2="1528" y2="560" stroke="#d7dce0"/><text x="84" y="615">Small brochure-site inquiry</text><text x="365" y="615">LinkedIn profile</text><text x="720" y="615">Profile only</text><text x="1240" y="615" font-weight="700" fill="#68737d">DISQUALIFIED</text><rect x="72" y="710" width="1456" height="210" rx="10" fill="#f5f7f8" stroke="#ccd3d8"/><text x="100" y="760" font-size="22" font-weight="700">What the tracker reveals</text><text x="100" y="810" font-size="23">Three opportunities reached qualification. One progressed to proposal, one remains in discovery, and one was ruled out.</text><text x="100" y="855" font-size="23">The useful question is not “How many likes did Alex get?” It is “Which social touchpoints helped the right buyers</text><text x="100" y="895" font-size="23">recognize the problem, verify fit, and enter a qualified conversation?”</text><rect x="72" y="970" width="1456" height="135" rx="10" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="1020" font-size="22" font-weight="700" fill="#8a6508">ATTRIBUTION RULE</text><text x="100" y="1065" font-size="22">Record first-known source, influential touchpoints, last-known conversion source, and whether revenue was directly attributed or influenced.</text></g><text x="72" y="1208" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Completed workbook example recreated as vector text for a sharp, legible product-page preview.</text></svg>