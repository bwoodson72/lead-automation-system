<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320"><rect width="1600" height="1320" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">DEVELOPER MARKETING QUICKSTART · P. 3</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Pick One Buyer</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">A first market only needs to be plausible enough to investigate.</text><g font-family="Georgia,serif" fill="#111820"><rect x="72" y="230" width="1456" height="110" rx="8" fill="#edf5ee"/><text x="98" y="272" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#365f45">USEFUL STARTING POINT</text><text x="98" y="312" font-size="25">Independent roofing companies that depend heavily on search and paid leads</text><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="72" y="382" width="1456" height="54" fill="#e8eef5"/><text x="92" y="416">TEST</text><text x="430" y="416">QUESTION TO ANSWER</text></g><g font-size="22"><rect x="72" y="436" width="1456" height="104" fill="#fff" stroke="#ccd3d8"/><text x="92" y="476" font-weight="700">Pain</text><text x="430" y="476">Does this buyer have a costly, frustrating, risky, or time-consuming problem?</text><rect x="72" y="540" width="1456" height="104" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="580" font-weight="700">Ability to pay</text><text x="430" y="580">Can the buyer plausibly spend money to solve it?</text><rect x="72" y="644" width="1456" height="104" fill="#fff" stroke="#ccd3d8"/><text x="92" y="684" font-weight="700">Reachability</text><text x="430" y="684">Can you identify and contact at least 25 real buyers?</text><rect x="72" y="748" width="1456" height="104" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="788" font-weight="700">Frequency / urgency</text><text x="430" y="788">Does the problem recur or become urgent at predictable moments?</text><rect x="72" y="852" width="1456" height="104" fill="#fff" stroke="#ccd3d8"/><text x="92" y="892" font-weight="700">Existing spending</text><text x="430" y="892">Do buyers already spend money, staff time, or tool budget on the problem?</text><rect x="72" y="1000" width="1456" height="180" rx="8" fill="#0b1f33"/><text x="100" y="1048" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#d6a72a">MOVE ON WHEN</text><text x="100" y="1094" font-size="23" fill="#ffffff">You can describe the buyer in one sentence, identify at least 25 real prospects,</text><text x="100" y="1132" font-size="23" fill="#ffffff">and explain why the group is plausible. Perfect certainty is not required.</text></g></g><text x="72" y="1268" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Guide excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>