<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600"><rect width="100%" height="100%" fill="#fff"/><text x="64" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c79a42">CLIENT ACQUISITION WITHOUT UPWORK  |  CHAPTER 45</text><text x="64" y="132" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0b1f33">The 30-Day Client Acquisition Sprint</text><text x="64" y="190" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#183b5b">The sprint is a sequence, not a test of whether you can complete six business systems by Wednesday.</text><text x="64" y="270" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#183b5b">Week 1: minimum viable setup</text><rect x="64" y="310" width="1470" height="82" fill="#0b1f33" stroke="#20252b" stroke-width="2"/><line x1="284" y1="310" x2="284" y2="392" stroke="#20252b" stroke-width="2"/><text x="82" y="362" font-family="Georgia, sans-serif" font-size="25" font-weight="700" fill="#fff">Day</text><text x="302" y="362" font-family="Georgia, sans-serif" font-size="25" font-weight="700" fill="#fff">Minimum milestone</text><rect x="64" y="392" width="1470" height="82" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="284" y1="392" x2="284" y2="474" stroke="#20252b" stroke-width="2"/><text x="82" y="444" font-family="Georgia, sans-serif" font-size="25" font-weight="400" fill="#101820">Day 1</text><text x="302" y="444" font-family="Georgia, sans-serif" font-size="25" font-weight="400" fill="#101820">Write one primary offer and one target buyer.</text><rect x="64" y="474" width="1470" height="82" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="284" y1="474" x2="284" y2="556" stroke="#20252b" stroke-width="2"/><text x="82" y="526" font-family="Georgia, sans-serif" font-size="25" font-weight="400" fill="#101820">Day 2</text><text x="302" y="526" font-family="Georgia, sans-serif" font-size="25" font-weight="400" fill="#101820">Define three observable problem signals and three disqualifiers.</text><rect x="64" y="556" width="1470" height="82" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="284" y1="556" x2="284" y2="638" stroke="#20252b" stroke-width="2"/><text x="82" y="608" font-family="Georgia, sans-serif" font-size="25" font-weight="400" fill="#101820">Day 3</text><text x="302" y="608" font-family="Georgia, sans-serif" font-size="25" font-weight="400" fill="#101820">Create the simple CRM using the supplied fields.</text><rect x="64" y="638" width="1470" height="82" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="284" y1="638" x2="284" y2="720" stroke="#20252b" stroke-width="2"/><text x="82" y="690" font-family="Georgia, sans-serif" font-size="25" font-weight="400" fill="#101820">Day 4</text><text x="302" y="690" font-family="Georgia, sans-serif" font-size="25" font-weight="400" fill="#101820">Choose one direct channel and one relationship channel.</text><rect x="64" y="720" width="1470" height="82" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="284" y1="720" x2="284" y2="802" stroke="#20252b" stroke-width="2"/><text x="82" y="772" font-family="Georgia, sans-serif" font-size="25" font-weight="400" fill="#101820">Day 5</text><text x="302" y="772" font-family="Georgia, sans-serif" font-size="25" font-weight="400" fill="#101820">Find and score the first five candidates. Deep-research only those that qualify.</text><rect x="64" y="837" width="1470" height="150" rx="8" fill="#eaf1f7"/><text x="92" y="879" font-family="Georgia, sans-serif" font-size="22" font-weight="700" fill="#c79a42">RECOVERY RULE</text><text x="92" y="920" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0b1f33"><tspan x="92" dy="0">If you fall behind, do not restart the sprint and do not compress several missed milestones into one frantic day.</tspan><tspan x="92" dy="28">Continue from the unfinished milestone and extend the calendar. Thirty days is a structure, not a deadline.</tspan></text><text x="64" y="1062" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#183b5b">Week 2: build the first pipeline</text><text x="86" y="1110" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#101820"><tspan x="86" dy="0">• Continue identifying a manageable batch of candidates.</tspan><tspan x="86" dy="32">• Qualify before deep research.</tspan><tspan x="86" dy="32">• Research the strongest prospects.</tspan><tspan x="86" dy="32">• Begin direct outreach.</tspan><tspan x="86" dy="32">• Record every action and schedule every follow-up.</tspan></text><text x="64" y="1322" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#183b5b">Week 3: follow up and build relationships</text><text x="86" y="1370" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#101820"><tspan x="86" dy="0">• Continue qualified prospecting.</tspan><tspan x="86" dy="32">• Run the follow-up sequence.</tspan><tspan x="86" dy="32">• Reactivate warm contacts.</tspan><tspan x="86" dy="32">• Begin referral and partner conversations.</tspan><tspan x="86" dy="32">• Participate in the chosen relationship channel.</tspan></text></svg>