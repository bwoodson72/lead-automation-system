<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="100%" height="100%" fill="#fff"/><text x="64" y="68" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c79a42">DEVELOPER SALES PLAYBOOK  |  WORKBOOK WB C15-X · P. 41</text><text x="64" y="126" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0b1f33">Business Problem Ladder</text><text x="64" y="176" font-family="Georgia, serif" font-size="26" fill="#34495e">Move downward only as far as the evidence supports.</text><rect x="64" y="206" width="1472" height="48" rx="6" fill="#edf6ee"/><text x="84" y="237" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#356b45">SUMMIT AIR AND HEAT - WORKED EXAMPLE</text><g font-family="Georgia, serif" fill="#101820"><text x="82" y="306" font-size="22" font-weight="700">Surface statement</text><text x="430" y="306" font-size="22">“The site feels outdated.”</text><text x="82" y="376" font-size="22" font-weight="700">Specific evidence</text><text x="430" y="376" font-size="22">Marketing cannot create new location-page structures without agency support;</text><text x="430" y="406" font-size="22">location information is duplicated.</text><text x="82" y="476" font-size="22" font-weight="700">Operational problem</text><text x="430" y="476" font-size="22">Campaign/location publishing depends on the current agency and updates are inconsistent.</text><text x="82" y="546" font-size="22" font-weight="700">Behavioral effect</text><text x="430" y="546" font-size="22">Marketing delays or routes campaigns to generic pages and works around the site structure.</text><text x="82" y="616" font-size="22" font-weight="700">Business consequence</text><text x="430" y="616" font-size="22">Expansion marketing is less flexible and market-level performance is harder to compare.</text><text x="82" y="686" font-size="22" font-weight="700">Strategic consequence</text><text x="430" y="686" font-size="22">The site system does not support the company’s move from one-office identity</text><text x="430" y="716" font-size="22">to a larger regional footprint.</text><text x="82" y="786" font-size="22" font-weight="700">Still inference</text><text x="430" y="786" font-size="22">Exact revenue impact and conversion loss are unknown; do not invent them.</text></g><rect x="64" y="846" width="1472" height="210" rx="10" fill="#fff6d8" stroke="#d69e00" stroke-width="2"/><text x="92" y="902" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c78d00">STOP WHERE THE EVIDENCE STOPS</text><text x="92" y="950" font-family="Georgia, serif" font-size="23" fill="#101820">A strategic consequence is not mandatory. If you cannot support it from buyer evidence,</text><text x="92" y="984" font-family="Georgia, serif" font-size="23" fill="#101820">leave it blank rather than climbing the ladder with speculation.</text><text x="64" y="1196" font-family="Arial, sans-serif" font-size="18" fill="#7b8791">Workbook excerpt recreated as vector text for legible product-page preview.</text></svg>