<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280"><rect width="1600" height="1280" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">PRODUCTIZE YOUR DEV SKILLS · P. 60</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Positioning → Market Test</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Define what evidence will make you continue, modify, or reconsider the offer.</text><g font-family="Georgia,serif" fill="#111820"><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="72" y="230" width="1456" height="54" fill="#e8eef5"/><text x="92" y="264">PROMPT</text><text x="455" y="264">EXAMPLE ANSWER</text></g><g font-size="22"><rect x="72" y="284" width="1456" height="116" fill="#fff" stroke="#ccd3d8"/><text x="92" y="326" font-weight="700">Positioning</text><text x="455" y="326">I help established home-service companies replace outdated lead-generation websites with</text><text x="455" y="362">focused, maintainable sites organized around services, trust, and inquiries.</text><rect x="72" y="400" width="1456" height="92" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="438" font-weight="700">Proof</text><text x="455" y="438">Portfolio · honest demonstration audit · process artifacts · verified testimonials/results only.</text><rect x="72" y="492" width="1456" height="92" fill="#fff" stroke="#ccd3d8"/><text x="92" y="530" font-weight="700">Test sample</text><text x="455" y="530">25–50 companies meeting the ideal-buyer criteria.</text><rect x="72" y="584" width="1456" height="116" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="622" font-weight="700">Evidence tracked</text><text x="455" y="622">Problem recognition · questions · objections · continued conversations · no-fit reasons.</text><rect x="72" y="700" width="1456" height="106" fill="#edf5ee" stroke="#a8c0ad"/><text x="92" y="740" font-weight="700">Continue rule</text><text x="455" y="740">Repeated problem recognition and relevant conversations.</text><rect x="72" y="806" width="1456" height="124" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="846" font-weight="700">Modify rule</text><text x="455" y="846">The problem is recognized, but offer, scope, or message repeatedly causes the same friction.</text><rect x="72" y="930" width="1456" height="124" fill="#fff0f0" stroke="#d9a4a4"/><text x="92" y="970" font-weight="700">Reconsider rule</text><text x="455" y="970">Qualified buyers consistently reject the premise or treat it as low priority.</text><rect x="72" y="1090" width="1456" height="96" rx="8" fill="#0b1f33"/><text x="100" y="1148" font-size="23" font-weight="700" fill="#ffffff">The offer is a hypothesis. Buyer evidence decides what changes next.</text></g></g><text x="72" y="1236" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Guide excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>