<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#ffffff"/><rect width="1600" height="170" fill="#081523"/><rect y="166" width="1600" height="4" fill="#d6a72a"/><text x="72" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d6a72a">FREELANCE DEVELOPER LAUNCH KIT · WORKSHEET 11 · WORKBOOK P. 24</text><text x="72" y="116" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#ffffff">Price the Obligation</text><text x="72" y="151" font-family="Georgia,serif" font-size="22" fill="#d6dce3">Separate internal sustainability from the commercial price you test.</text><text x="72" y="220" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#365f45">ALEX MORGAN / SUMMIT AIR &amp; HEAT · COMPLETED EXAMPLE</text><g font-family="Arial,sans-serif"><rect x="72" y="255" width="340" height="154" rx="10" fill="#f6f7f8" stroke="#ccd3d8"/><text x="96" y="294" font-size="18" font-weight="700" fill="#26323d">Annual planning requirement</text><text x="96" y="351" font-size="38" font-weight="700" fill="#0b1f33">$55,200</text><text x="96" y="382" font-size="17" fill="#5c6872">Compensation + overhead + resilience</text><rect x="438" y="255" width="340" height="154" rx="10" fill="#f6f7f8" stroke="#ccd3d8"/><text x="462" y="294" font-size="18" font-weight="700" fill="#26323d">Planning project capacity</text><text x="462" y="351" font-size="38" font-weight="700" fill="#0b1f33">920 h</text><text x="462" y="382" font-size="17" fill="#5c6872">Not every working hour is sellable</text><rect x="804" y="255" width="340" height="154" rx="10" fill="#f6f7f8" stroke="#ccd3d8"/><text x="828" y="294" font-size="18" font-weight="700" fill="#26323d">Internal planning burden</text><text x="828" y="351" font-size="38" font-weight="700" fill="#0b1f33">$60 / h</text><text x="828" y="382" font-size="17" fill="#5c6872">$55,200 ÷ 920 project hours</text><rect x="1170" y="255" width="358" height="154" rx="10" fill="#f6f7f8" stroke="#ccd3d8"/><text x="1194" y="294" font-size="18" font-weight="700" fill="#26323d">Summit estimate</text><text x="1194" y="351" font-size="38" font-weight="700" fill="#0b1f33">77 h</text><text x="1194" y="382" font-size="17" fill="#5c6872">52 production + 17 coordination + 8 variability</text><path d="M412 332 H438 M778 332 H804 M1144 332 H1170" stroke="#d6a72a" stroke-width="4"/><rect x="72" y="455" width="700" height="150" rx="10" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="498" font-size="20" font-weight="700" fill="#6c5109">INTERNAL ECONOMIC FLOOR</text><text x="100" y="554" font-size="42" font-weight="700" fill="#8a6508">77 × $60 = $4,620</text><text x="100" y="584" font-size="18" fill="#6f6446">A sustainability boundary, not the buyer-facing price.</text><rect x="828" y="455" width="700" height="150" rx="10" fill="#edf5ee" stroke="#a8c0ad" stroke-width="2"/><text x="856" y="498" font-size="20" font-weight="700" fill="#365f45">COMMERCIAL PRICE HYPOTHESIS</text><text x="856" y="554" font-size="42" font-weight="700" fill="#365f45">$6,500</text><text x="856" y="584" font-size="18" fill="#52685a">Chosen for testing after scope, alternatives, proof, uncertainty and market evidence are considered.</text><rect x="72" y="651" width="1456" height="236" rx="10" fill="#f7f8fa" stroke="#ccd3d8"/><text x="100" y="695" font-size="21" font-weight="700" fill="#26323d">The worksheet forces three different decisions to stay separate</text><text x="100" y="740" font-size="20" fill="#303b45">1. What must this business economically support?</text><text x="100" y="780" font-size="20" fill="#303b45">2. Which pricing mechanism allocates this obligation and uncertainty responsibly?</text><text x="100" y="820" font-size="20" fill="#303b45">3. What commercial price is justified enough to test with this buyer and this market?</text><text x="100" y="860" font-size="18" fill="#6b747c">The $6,500 figure is an illustrative tested point, not a universal rate or “value pricing” formula.</text></g><text x="72" y="946" font-family="Arial,sans-serif" font-size="16" fill="#77818a">Readable proof excerpt reconstructed from the production-final workbook.</text></svg>