name: Pricing Calculator Validation

on:
  push:
    branches:
      - feature/freelance-project-pricing-calculator
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricing-calculator-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, Astro check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
    steps:
      - name: Checkout complete feature branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run pricing-domain unit tests
        run: npm run test:unit

      - name: Check Astro and Svelte types
        run: npm run check

      - name: Build entire Astro site
        run: npm run build
