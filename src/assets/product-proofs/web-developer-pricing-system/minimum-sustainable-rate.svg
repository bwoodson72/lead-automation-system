<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320"><rect width="1600" height="1320" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">WEB DEVELOPER PRICING SYSTEM · P. 13</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Minimum Sustainable Rate</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Turn annual business requirements into an internal economic threshold.</text><g font-family="Georgia,serif" fill="#111820"><rect x="72" y="230" width="1456" height="90" rx="8" fill="#edf5ee"/><text x="100" y="270" font-size="20" font-weight="700">FORMULA</text><text x="100" y="304" font-size="25">MSR = required annual business revenue ÷ realistic annual revenue-producing hours</text><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="72" y="360" width="1456" height="54" fill="#e8eef5"/><text x="92" y="394">REQUIREMENT</text><text x="1040" y="394">ILLUSTRATIVE AMOUNT</text></g><g font-size="23"><rect x="72" y="414" width="1456" height="78" fill="#fff" stroke="#ccd3d8"/><text x="92" y="462">Owner compensation</text><text x="1060" y="462" font-weight="700">$80,000</text><rect x="72" y="492" width="1456" height="78" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="540">Overhead</text><text x="1060" y="540" font-weight="700">$12,000</text><rect x="72" y="570" width="1456" height="78" fill="#fff" stroke="#ccd3d8"/><text x="92" y="618">Benefits / retirement / insurance allowance</text><text x="1060" y="618" font-weight="700">$12,000</text><rect x="72" y="648" width="1456" height="78" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="696">Profit and reserve target</text><text x="1060" y="696" font-weight="700">$10,000</text><rect x="72" y="726" width="1456" height="84" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="777" font-weight="700">Required annual business revenue</text><text x="1060" y="777" font-weight="700">$114,000</text><rect x="72" y="850" width="1456" height="172" rx="8" fill="#0b1f33"/><text x="100" y="900" font-size="26" font-weight="700" fill="#fff">$114,000 ÷ 1,104 hours = $103.26 per revenue-producing hour</text><text x="100" y="946" font-size="22" fill="#d8dee5">This is not a public hourly rate. It is the internal threshold repeated work must support.</text><text x="100" y="988" font-size="22" fill="#d8dee5">A project that realizes $55 per actual hour cannot sustain this illustrative business plan.</text><rect x="72" y="1060" width="1456" height="142" rx="8" fill="#f7f8fa" stroke="#ccd3d8"/><text x="100" y="1110" font-size="24" font-weight="700">Operating distinction</text><text x="100" y="1154" font-size="22">The MSR is not the price. It is one constraint used to decide whether the work supports the business.</text></g></g><text x="72" y="1268" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Guide excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>