<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420"><rect width="1600" height="1420" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">WEB DEVELOPER PRICING SYSTEM · CURRENT EDITION</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Northstar Worked Pricing Decision</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">A fictional example that makes every major pricing decision visible.</text><rect x="72" y="230" width="1456" height="66" rx="6" fill="#edf5ee"/><text x="96" y="271" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">NORTHSTAR HEATING &amp; AIR · FICTIONAL RUNNING EXAMPLE</text><g font-family="Georgia,serif" fill="#111820"><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="72" y="330" width="1456" height="54" fill="#e8eef5"/><text x="92" y="364">DECISION</text><text x="610" y="364">CURRENT RECORD</text></g><g font-size="22"><rect x="72" y="384" width="1456" height="82" fill="#fff" stroke="#ccd3d8"/><text x="92" y="434">Working Minimum Sustainable Rate</text><text x="630" y="434" font-weight="700">$105 per revenue-producing hour</text><rect x="72" y="466" width="1456" height="100" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="516">Whole-Engagement Estimate</text><text x="630" y="506">63 expected hours across discovery, planning, implementation,</text><text x="630" y="538">communication, QA, revisions, launch, and content cleanup</text><rect x="72" y="566" width="1456" height="82" fill="#fff" stroke="#ccd3d8"/><text x="92" y="616">Direct project costs</text><text x="630" y="616" font-weight="700">$285</text><rect x="72" y="648" width="1456" height="92" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="704" font-weight="700">Project Economic Floor</text><text x="630" y="704" font-weight="700">63 × $105 + $285 = $6,900</text><rect x="72" y="740" width="1456" height="100" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="796">Uncertainty response</text><text x="630" y="786">Main form / CRM dependency verified before commitment;</text><text x="630" y="818">remaining uncertainty is bounded enough for fixed price</text><rect x="72" y="840" width="1456" height="82" fill="#fff" stroke="#ccd3d8"/><text x="92" y="890">Pricing Model</text><text x="630" y="890" font-weight="700">Fixed price</text><rect x="72" y="922" width="1456" height="102" fill="#edf5ee" stroke="#a8c0ad"/><text x="92" y="980" font-weight="700">Commercial Price</text><text x="630" y="970" font-weight="700">$8,500</text><text x="630" y="1002" font-size="20">chosen after candidate testing and Commercial Context review</text><rect x="72" y="1024" width="1456" height="96" fill="#fff" stroke="#ccd3d8"/><text x="92" y="1080">Payment structure</text><text x="630" y="1080">40% start · 30% progress state · 30% final / handoff state</text><rect x="72" y="1120" width="1456" height="96" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="1176">Post-project evidence</text><text x="630" y="1166">68 actual base-project hours · $125 Realized Revenue per</text><text x="630" y="1198">Actual Effort Hour · two targeted policy corrections</text><rect x="72" y="1250" width="1456" height="96" rx="8" fill="#0b1f33"/><text x="100" y="1292" font-size="21" font-weight="700" fill="#fff">The floor is not the price, and the price is not the end of the system.</text><text x="100" y="1325" font-size="20" fill="#d8dee5">Delivery evidence returns to the policy and improves the next decision.</text></g></g><text x="72" y="1388" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Current-edition Northstar example recreated as vector text for a legible product-page proof.</text></svg>