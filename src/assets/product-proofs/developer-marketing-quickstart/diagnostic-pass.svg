<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380"><rect width="1600" height="1380" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">DEVELOPER MARKETING QUICKSTART · P. 15</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">What Happens After the First Batch</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">The numbers are illustrative. The method is to diagnose the weakest stage instead of abandoning the whole system.</text><g font-family="Georgia,serif" fill="#111820"><g font-family="Arial,sans-serif" font-size="18" font-weight="700"><rect x="72" y="230" width="1456" height="54" fill="#e8eef5"/><text x="92" y="264">STAGE</text><text x="520" y="264">ILLUSTRATIVE COUNT</text><text x="850" y="264">QUESTION TO ASK</text></g><g font-size="21"><rect x="72" y="284" width="1456" height="94" fill="#fff" stroke="#ccd3d8"/><text x="92" y="322" font-weight="700">Qualified prospects</text><text x="560" y="322">25</text><text x="850" y="322">Was the buyer definition narrow and defensible?</text><rect x="72" y="378" width="1456" height="94" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="416" font-weight="700">Delivered outreach</text><text x="560" y="416">23</text><text x="850" y="416">Were contact routes accurate and deliverability acceptable?</text><rect x="72" y="472" width="1456" height="94" fill="#fff" stroke="#ccd3d8"/><text x="92" y="510" font-weight="700">Replies</text><text x="560" y="510">4</text><text x="850" y="510">Did the message earn enough attention to start a conversation?</text><rect x="72" y="566" width="1456" height="94" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="604" font-weight="700">Positive interest</text><text x="560" y="604">1</text><text x="850" y="604">Is the problem important enough and is the offer credible?</text><rect x="72" y="660" width="1456" height="94" fill="#fff" stroke="#ccd3d8"/><text x="92" y="698" font-weight="700">Calls</text><text x="560" y="698">1</text><text x="850" y="698">Is the CTA easy enough and is there enough trust / proof?</text><rect x="72" y="754" width="1456" height="108" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="792" font-weight="700">Proposals</text><text x="560" y="792">0</text><text x="850" y="792">Did the call reveal poor fit, weak value, missing proof, timing,</text><text x="850" y="826">or a sales-process issue?</text><rect x="72" y="906" width="1456" height="192" rx="8" fill="#fff8e6" stroke="#d6a72a"/><text x="98" y="950" font-family="Arial,sans-serif" font-size="19" font-weight="700">MAYA'S NEXT EXPERIMENT</text><text x="98" y="996" font-size="22">She does not abandon roofing, launch paid ads, rewrite the entire website, and start a newsletter.</text><text x="98" y="1034" font-size="22">She reads the replies, identifies a repeated pattern, changes one meaningful variable,</text><text x="98" y="1072" font-size="22">and runs the next batch.</text><rect x="72" y="1140" width="1456" height="146" rx="8" fill="#0b1f33"/><text x="100" y="1186" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#d6a72a">DEBUGGING RULE</text><text x="100" y="1230" font-size="22" fill="#ffffff">Fix the weakest stage. Change one important variable when practical, record it,</text><text x="100" y="1266" font-size="22" fill="#ffffff">and compare what happens next.</text></g></g><text x="72" y="1334" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Guide excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>