<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600">
  <rect width="1400" height="1600" fill="#ffffff"/>
  <rect width="1400" height="150" fill="#0a0a0a"/>
  <text x="28" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#d6a13a">DEVELOPER BUSINESS LAB | AGENCY PARTNERSHIP PLAYBOOK</text>
  <text x="28" y="118" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#f4f4f2">AP23 · Agency Relationship Economics Review</text>
  <text x="1035" y="42" font-family="Arial, sans-serif" font-size="17" fill="#c7c7c3">PRODUCTION-FINAL WORKBOOK EXCERPT</text>

  <rect x="28" y="205" width="1344" height="130" rx="16" fill="#f4f4f2" stroke="#d7d7d3"/>
  <text x="62" y="258" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#171717">Review the relationship, not just the last project.</text>
  <text x="62" y="302" font-family="Arial, sans-serif" font-size="21" fill="#424242">Count project service demand and relationship-level effort, then diagnose what is improving or deteriorating.</text>

  <text x="28" y="400" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#7a4f13">WORKED EXAMPLE · BRIGHTLINE RELATIONSHIP ECONOMICS</text>

  <g font-family="Arial, sans-serif">
    <rect x="28" y="445" width="1344" height="84" rx="10" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="497" font-size="22" font-weight="700" fill="#171717">Review window</text><text x="470" y="497" font-size="22" fill="#171717">Three-month reservation term</text>

    <rect x="28" y="542" width="1344" height="84" rx="10" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="594" font-size="22" font-weight="700" fill="#171717">Relationship revenue</text><text x="470" y="594" font-size="22" fill="#171717">$10,800</text>

    <rect x="28" y="639" width="1344" height="84" rx="10" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="691" font-size="22" font-weight="700" fill="#171717">Relationship-specific cash costs</text><text x="470" y="691" font-size="22" fill="#171717">$360</text>

    <rect x="28" y="736" width="1344" height="84" rx="10" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="788" font-size="22" font-weight="700" fill="#171717">Project service hours</text><text x="470" y="788" font-size="22" fill="#171717">68 h</text>

    <rect x="28" y="833" width="1344" height="112" rx="10" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="880" font-size="22" font-weight="700" fill="#171717">Unassigned relationship service hours</text><text x="470" y="880" font-size="22" fill="#171717">20 h</text>
    <text x="470" y="919" font-size="19" fill="#555555">9 presales · 4 capacity/account planning · 3 coordination · 2 admin · 2 troubleshooting</text>

    <rect x="28" y="958" width="1344" height="84" rx="10" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="1010" font-size="22" font-weight="700" fill="#171717">Total relationship service hours</text><text x="470" y="1010" font-size="22" fill="#171717">88 h</text>

    <rect x="28" y="1067" width="1344" height="150" rx="16" fill="#eef4ed" stroke="#bad0b8"/>
    <text x="62" y="1120" font-size="23" font-weight="700" fill="#285b2d">RELATIONSHIP-WIDE COMPARISON</text>
    <text x="62" y="1168" font-size="27" font-weight="700" fill="#171717">($10,800 - $360) / 88 = about $119 per service hour</text>
    <text x="62" y="1203" font-size="18" fill="#555555">Jordan's $100 floor is fictional scenario data, not a recommended freelancer rate.</text>

    <rect x="28" y="1242" width="1344" height="176" rx="16" fill="#fff7df" stroke="#d6a13a"/>
    <text x="62" y="1295" font-size="24" font-weight="700" fill="#7a4f13">STATE: WATCH</text>
    <text x="62" y="1341" font-size="21" fill="#171717">The relationship clears Jordan's fictional floor, but speculative presales is a deteriorating driver.</text>
    <text x="62" y="1382" font-size="21" fill="#171717">A strong average does not erase a growing cost mechanism. Chapter 24 decides what to change.</text>

    <text x="28" y="1497" font-size="19" fill="#555555">Scenario values are instructional examples. They are not market benchmarks or customer results.</text>
  </g>
</svg>