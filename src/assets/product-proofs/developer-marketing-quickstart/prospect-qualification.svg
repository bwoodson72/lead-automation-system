<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1360" viewBox="0 0 1600 1360"><rect width="1600" height="1360" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">DEVELOPER MARKETING QUICKSTART · P. 9</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Qualify Before You Contact</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Use a working score to prioritize research and outreach without pretending the score proves anything.</text><g font-family="Georgia,serif" fill="#111820"><g font-family="Arial,sans-serif" font-size="18" font-weight="700"><rect x="72" y="232" width="1456" height="56" fill="#e8eef5"/><text x="92" y="268">CRITERION</text><text x="410" y="268">0</text><text x="700" y="268">1</text><text x="1010" y="268">2</text></g><g font-size="20"><rect x="72" y="288" width="1456" height="112" fill="#fff" stroke="#ccd3d8"/><text x="92" y="330" font-weight="700">Buyer fit</text><text x="410" y="330">Does not match</text><text x="700" y="330">Partial / uncertain</text><text x="1010" y="330">Clearly matches buyer definition</text><rect x="72" y="400" width="1456" height="112" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="442" font-weight="700">Problem evidence</text><text x="410" y="442">No signal</text><text x="700" y="442">Plausible but weak</text><text x="1010" y="442">Specific current evidence or workflow</text><rect x="72" y="512" width="1456" height="112" fill="#fff" stroke="#ccd3d8"/><text x="92" y="554" font-weight="700">Ability to pay</text><text x="410" y="554">Unlikely</text><text x="700" y="554">Unclear</text><text x="1010" y="554">Plausible based on business / role</text><rect x="72" y="624" width="1456" height="112" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="666" font-weight="700">Reachability</text><text x="410" y="666">No usable route</text><text x="700" y="666">Generic route only</text><text x="1010" y="666">Relevant contact or credible route</text><rect x="72" y="736" width="1456" height="112" fill="#fff" stroke="#ccd3d8"/><text x="92" y="778" font-weight="700">Reason to act</text><text x="410" y="778">No visible reason</text><text x="700" y="778">Possible timing / value</text><text x="1010" y="778">Clear consequence, trigger, or recurring pain</text><rect x="72" y="894" width="1456" height="168" rx="8" fill="#edf5ee" stroke="#a8c0ad"/><text x="98" y="938" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#365f45">WORKING RULE</text><text x="98" y="982" font-size="23">Score each prospect from 0–10 and start with the highest-quality names.</text><text x="98" y="1020" font-size="23">Verify every claim you plan to use. Disqualify obvious non-fits instead of forcing an angle.</text><rect x="72" y="1100" width="1456" height="164" rx="8" fill="#0b1f33"/><text x="100" y="1146" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#d6a72a">MINIMUM EVIDENCE BEFORE PERSONALIZED OUTREACH</text><text x="100" y="1190" font-size="21" fill="#ffffff">Buyer fit · current defensible reason or research-first framing · legitimate contact route</text><text x="100" y="1228" font-size="21" fill="#ffffff">No invented performance, technology, advertising, security, or conversion claims.</text></g></g><text x="72" y="1310" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Guide excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>