<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1400" viewBox="0 0 1600 1400"><rect width="1600" height="1400" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">PRODUCTIZE YOUR DEV SKILLS · P. 22</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Productization Scorecard</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Use evidence to decide what is safe to standardize.</text><rect x="72" y="226" width="1456" height="58" rx="6" fill="#edf5ee"/><text x="94" y="264" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">COMPLETED EXAMPLE · LEAD-GENERATION WEBSITE SYSTEM</text><g font-family="Georgia,serif" fill="#111820"><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="72" y="320" width="1456" height="54" fill="#e8eef5"/><text x="92" y="354">FACTOR</text><text x="700" y="354">SCORE</text><text x="900" y="354">WHAT THE SCORE MEANS HERE</text></g><g font-size="22"><rect x="72" y="374" width="1456" height="86" fill="#fff" stroke="#ccd3d8"/><text x="92" y="410">Repetition</text><text x="712" y="410" font-weight="700">4 / 5</text><text x="900" y="410">The same core problem appears across similar buyers.</text><rect x="72" y="460" width="1456" height="86" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="496">Predictability</text><text x="712" y="496" font-weight="700">4 / 5</text><text x="900" y="496">Effort falls inside a useful range.</text><rect x="72" y="546" width="1456" height="86" fill="#fff" stroke="#ccd3d8"/><text x="92" y="582">Buyer similarity</text><text x="712" y="582" font-weight="700">4 / 5</text><text x="900" y="582">Qualified buyers share recurring constraints.</text><rect x="72" y="632" width="1456" height="86" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="668">Outcome clarity</text><text x="712" y="668" font-weight="700">4 / 5</text><text x="900" y="668">The improved condition is easy to describe.</text><rect x="72" y="718" width="1456" height="86" fill="#fff" stroke="#ccd3d8"/><text x="92" y="754">Scope control</text><text x="712" y="754" font-weight="700">4 / 5</text><text x="900" y="754">Boundaries can be made explicit.</text><rect x="72" y="804" width="1456" height="86" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="840">Value</text><text x="712" y="840" font-weight="700">4 / 5</text><text x="900" y="840">The problem has a meaningful consequence.</text><rect x="72" y="890" width="1456" height="86" fill="#fff" stroke="#ccd3d8"/><text x="92" y="926">Systemization</text><text x="712" y="926" font-weight="700">5 / 5</text><text x="900" y="926">Templates and processes can be reused.</text><rect x="72" y="976" width="1456" height="86" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="1012">Reachability</text><text x="712" y="1012" font-weight="700">5 / 5</text><text x="900" y="1012">Plausible prospects are easy to identify.</text></g><rect x="72" y="1100" width="1456" height="166" rx="8" fill="#fff8e6" stroke="#d6a72a"/><text x="100" y="1146" font-size="28" font-weight="700">34 / 40 · proceed, but design around the weak point</text><text x="100" y="1192" font-size="22">Weakest question: content availability can destabilize the timeline.</text><text x="100" y="1232" font-size="22">Design response: make client content responsibilities explicit and offer bounded copy support as an add-on.</text></g><text x="72" y="1346" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Guide excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>