name: Pricing Calculator Validation

on:
  push:
    branches:
      - feature/freelance-project-pricing-calculator
      - feature/pricing-calculator-clearer-guidance
      - feature/pricing-calculator-site-navigation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricing-calculator-validation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests, Astro check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CI: "true"
    steps:
      - name: Checkout complete feature branch
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run pricing-domain unit tests
        run: npm run test:unit

      - name: Check Astro and Svelte types
        run: npm run check

      - name: Build entire Astro site
        if: ${{ always() }}
        run: npm run build

      - name: Validate generated calculator landing-page HTML
        if: ${{ always() }}
        run: node scripts/check-pricing-landing-page.mjs

      - name: Check release-candidate sitemap and robots gate
        run: node scripts/check-pricing-indexing.mjs indexed

      - name: Verify contextual pricing links and existing checkout CTAs
        if: ${{ always() }}
        run: node scripts/check-pricing-links.mjs
      
      - name: Install Chromium QA dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Run calculator browser QA
        run: node scripts/check-pricing-browser.mjs

      - name: Smoke-test built static preview
        run: node scripts/check-pricing-preview.mjs
