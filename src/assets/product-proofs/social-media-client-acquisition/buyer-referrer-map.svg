<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="1600" height="1260" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">SOCIAL MEDIA CLIENT ACQUISITION · WORKSHEET 3</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Buyer &amp; Referrer Map</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Separate people who can create commercial value from people who simply make the audience look active.</text><rect x="72" y="230" width="1456" height="50" rx="6" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">FICTIONAL RUNNING EXAMPLE · ALEX MORGAN</text><g font-family="Arial,sans-serif"><text x="82" y="340" font-size="20" font-weight="700" fill="#0b1f33">ROLE</text><text x="350" y="340" font-size="20" font-weight="700" fill="#0b1f33">AUDIENCE GROUP</text><text x="980" y="340" font-size="20" font-weight="700" fill="#0b1f33">COMMERCIAL JOB</text><text x="1390" y="340" font-size="20" font-weight="700" fill="#0b1f33">PRIORITY</text></g><g font-family="Georgia,serif" font-size="22" fill="#111820"><line x1="72" y1="375" x2="1528" y2="375" stroke="#d7dce0"/><text x="82" y="430" font-weight="700">Buyer</text><text x="350" y="430">Owners / managing partners at professional-service firms</text><text x="980" y="430">Can authorize website work</text><text x="1390" y="430" fill="#8a6508" font-weight="700">HIGH</text><line x1="72" y1="465" x2="1528" y2="465" stroke="#d7dce0"/><text x="82" y="520" font-weight="700">Influencer</text><text x="350" y="520">Marketing or operations lead</text><text x="980" y="520">Shapes requirements and vendor confidence</text><text x="1390" y="520" fill="#8a6508" font-weight="700">HIGH</text><line x1="72" y1="555" x2="1528" y2="555" stroke="#d7dce0"/><text x="82" y="610" font-weight="700">Referrer</text><text x="350" y="610">Brand strategists / copywriters / fractional marketers</text><text x="980" y="610">Can introduce qualified firms</text><text x="1390" y="610" fill="#8a6508" font-weight="700">HIGH</text><line x1="72" y1="645" x2="1528" y2="645" stroke="#d7dce0"/><text x="82" y="700" font-weight="700">Partner</text><text x="350" y="700">Small agencies without in-house development</text><text x="980" y="700">Can subcontract or collaborate</text><text x="1390" y="700" fill="#8a6508" font-weight="700">MED-HIGH</text><line x1="72" y1="735" x2="1528" y2="735" stroke="#d7dce0"/><text x="82" y="790" font-weight="700">Peer</text><text x="350" y="790">Other developers</text><text x="980" y="790">Learning, reputation, occasional referral</text><text x="1390" y="790" fill="#68737d" font-weight="700">MEDIUM</text><rect x="72" y="865" width="1456" height="220" rx="10" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="915" font-size="22" font-weight="700" fill="#8a6508">ALEX'S DIAGNOSIS</text><text x="100" y="965" font-size="25" font-weight="700" fill="#0b1f33">His audience is active—but overrepresented by technical peers.</text><text x="100" y="1012" font-size="22">The next content and engagement decisions should increase buyer, influencer, referrer, and partner relevance</text><text x="100" y="1052" font-size="22">without treating useful peers as worthless.</text></g><text x="72" y="1208" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Completed workbook example recreated as vector text for a sharp, legible product-page preview.</text></svg>