<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600"><rect width="1600" height="1600" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">PRODUCTIZE YOUR DEV SKILLS · P. 58</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Completed Offer Specification</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">The entire offer compressed into one operating document.</text><g font-family="Georgia,serif" fill="#111820"><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="72" y="230" width="1456" height="54" fill="#e8eef5"/><text x="92" y="264">FIELD</text><text x="455" y="264">COMPLETED EXAMPLE</text></g><g font-size="21"><rect x="72" y="284" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="320" font-weight="700">Ideal buyer</text><text x="455" y="320">Established home-service company that depends on calls, inquiries, or estimate requests.</text><rect x="72" y="372" width="1456" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="408" font-weight="700">Trigger</text><text x="455" y="408">Website is outdated, hard to maintain, or misaligned with current services or market.</text><rect x="72" y="460" width="1456" height="104" fill="#fff" stroke="#ccd3d8"/><text x="92" y="496" font-weight="700">Primary problem</text><text x="455" y="496">Prospects work too hard to understand services, trust the business, and take the next action.</text><rect x="72" y="564" width="1456" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="600" font-weight="700">Outcome</text><text x="455" y="600">Modern, maintainable site organized around service discovery, trust, local relevance, and inquiries.</text><rect x="72" y="652" width="1456" height="104" fill="#fff" stroke="#ccd3d8"/><text x="92" y="688" font-weight="700">Qualification</text><text x="455" y="688">Marketing site · bounded integrations · decision-maker available · content plan exists</text><text x="455" y="722">standard timeline is workable.</text><rect x="72" y="756" width="1456" height="104" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="792" font-weight="700">Core deliverables</text><text x="455" y="792">Discovery · page architecture · responsive build · forms · analytics · technical foundations</text><text x="455" y="826">accessibility/performance QA · launch · handoff.</text><rect x="72" y="860" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="896" font-weight="700">Exclusions</text><text x="455" y="896">Ecommerce · portals · undefined custom apps · unlimited revisions · open-ended migrations.</text><rect x="72" y="948" width="1456" height="104" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="984" font-weight="700">Client responsibilities</text><text x="455" y="984">Access · business information · approvals · required content/assets · consolidated feedback</text><text x="455" y="1018">on schedule.</text><rect x="72" y="1052" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="1088" font-weight="700">Process</text><text x="455" y="1088">Qualify → kickoff → plan → build → review / QA → launch / handoff.</text><rect x="72" y="1140" width="1456" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="1176" font-weight="700">Add-ons</text><text x="455" y="1176">Additional service/location pages · copy support · bounded integrations · ongoing optimization.</text><rect x="72" y="1228" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="1264" font-weight="700">Proof</text><text x="455" y="1264">Relevant portfolio work · process artifacts · public diagnostic examples · client validation as available.</text><rect x="72" y="1316" width="1456" height="116" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="1354" font-weight="700">Pitch</text><text x="455" y="1354">I build lead-generation websites for established home-service companies whose current site</text><text x="455" y="1388">makes it harder for prospects to understand services and request an estimate.</text><rect x="72" y="1432" width="1456" height="74" fill="#0b1f33"/><text x="92" y="1478" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">CTA</text><text x="455" y="1478" font-size="22" fill="#fff">Book a fit call.</text></g></g><text x="72" y="1554" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Guide excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>