<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1306" viewBox="0 0 1600 1306"><rect width="100%" height="100%" fill="#fff"/><text x="64" y="68" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c79a42">DEVELOPER PROPOSAL &amp; CLOSING KIT  |  WORKBOOK PC16 · P. 33</text><text x="64" y="126" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0b1f33">Objection Diagnostic</text><text x="64" y="176" font-family="Georgia, serif" font-size="26" fill="#34495e">Turn the buyer&#x27;s surface phrase into the specific decision problem you can actually address.</text><rect x="64" y="202" width="1472" height="48" rx="4" fill="#edf6ee"/><text x="84" y="233" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#356b45">REDWOOD ROOFING - WORKED EXAMPLE</text><rect x="64" y="260" width="1472" height="76" fill="#0b1f33"/><line x1="444" y1="260" x2="444" y2="336" stroke="#32475a" stroke-width="2"/><text x="82" y="306" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#fff">Prompt / decision</text><text x="462" y="306" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#fff">Worked answer</text><rect x="64" y="336" width="1472" height="100" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="336" x2="444" y2="436" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="370" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Buyer statement</text><text x="462" y="370" font-family="Georgia, serif" font-size="22" fill="#101820">“It’s a little more than I expected.”</text><rect x="64" y="436" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="436" x2="444" y2="546" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="470" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Neutral restatement</text><text x="462" y="470" font-family="Georgia, serif" font-size="22" fill="#101820">The investment is above the owner&#x27;s expectation and the initial payment</text><text x="462" y="500" font-family="Georgia, serif" font-size="22" fill="#101820">also feels heavy.</text><rect x="64" y="546" width="1472" height="100" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="546" x2="444" y2="646" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="580" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Diagnostic question</text><text x="462" y="580" font-family="Georgia, serif" font-size="22" fill="#101820">“What range were you expecting, and what was that based on?”</text><rect x="64" y="646" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="646" x2="444" y2="756" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="680" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Evidence learned</text><text x="462" y="680" font-family="Georgia, serif" font-size="22" fill="#101820">Owner had $7,000 in mind from a local designer quote and is also worried</text><text x="462" y="710" font-family="Georgia, serif" font-size="22" fill="#101820">about paying half upfront.</text><rect x="64" y="756" width="1472" height="100" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="756" x2="444" y2="856" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="790" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Category</text><text x="462" y="790" font-family="Georgia, serif" font-size="22" fill="#101820">Two issues: scope/price comparison + cash-flow/payment timing.</text><rect x="64" y="856" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="856" x2="444" y2="966" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="890" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Response</text><text x="462" y="890" font-family="Georgia, serif" font-size="22" fill="#101820">Compare actual scope/responsibilities; then discuss payment timing</text><text x="462" y="920" font-family="Georgia, serif" font-size="22" fill="#101820">separately without automatically changing total price.</text><rect x="64" y="966" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="966" x2="444" y2="1076" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1000" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Does response resolve</text><text x="82" y="1030" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">it?</text><text x="462" y="1000" font-family="Georgia, serif" font-size="22" fill="#101820">Yes enough to continue to a commercial trade discussion.</text><rect x="64" y="1076" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="1076" x2="444" y2="1186" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1110" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Next decision</text><text x="462" y="1110" font-family="Georgia, serif" font-size="22" fill="#101820">Choose final payment structure and confirm whether the $8,500 scope</text><text x="462" y="1140" font-family="Georgia, serif" font-size="22" fill="#101820">still fits.</text><text x="64" y="1266" font-family="Arial, sans-serif" font-size="18" fill="#7b8791">Workbook excerpt recreated as vector text for legible product-page preview.</text></svg>