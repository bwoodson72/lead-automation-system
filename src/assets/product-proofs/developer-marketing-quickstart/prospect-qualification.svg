<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1280" viewBox="0 0 1600 1280"><rect width="1600" height="1280" fill="#fff"/><rect width="1600" height="170" fill="#0a0a0a"/><rect y="166" width="1600" height="4" fill="#d6a13a"/><text x="72" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d6a13a">DEVELOPER MARKETING QUICKSTART WORKBOOK · PP. 10–12</text><text x="72" y="116" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#f4f4f2">First 25 Prospect Builder</text><text x="72" y="148" font-family="Georgia,serif" font-size="21" fill="#c7c7c3">Source first. Qualify before you spend research and personalization time.</text><g font-family="Arial,sans-serif"><rect x="72" y="220" width="1456" height="60" fill="#171717"/><g fill="#f4f4f2" font-size="17" font-weight="700"><text x="88" y="258">PROSPECT</text><text x="315" y="258">FIT</text><text x="390" y="258">PROBLEM</text><text x="515" y="258">PAY</text><text x="590" y="258">REACH</text><text x="700" y="258">ACT</text><text x="780" y="258">TOTAL</text><text x="885" y="258">PRIORITY</text><text x="1020" y="258">CONTACT / ROUTE / STATUS</text></g><rect x="72" y="280" width="1456" height="132" fill="#fff8e8" stroke="#d9d9d9"/><g font-family="Georgia,serif" font-size="20" fill="#111820"><text x="88" y="326">Prospect 07</text><text x="330" y="326">2</text><text x="430" y="326">2</text><text x="530" y="326">2</text><text x="620" y="326">2</text><text x="715" y="326">1</text><text x="810" y="326" font-weight="700">9</text><text x="915" y="326" font-weight="700">A</text><text x="1020" y="326">Owner / business email / verified</text><text x="88" y="372" font-size="18" fill="#555">Verified observation: service pages route visitors to a general contact form instead of a clearly framed estimate step.</text></g><rect x="72" y="455" width="820" height="360" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/><text x="98" y="500" font-size="18" font-weight="700" fill="#9a641c">FIVE QUALIFICATION FACTORS</text><g font-family="Georgia,serif" font-size="22" fill="#111820"><text x="98" y="550"><tspan font-weight="700">Buyer fit:</tspan> matches the Chapter 1 definition</text><text x="98" y="600"><tspan font-weight="700">Problem evidence:</tspan> current signal, not just a guess</text><text x="98" y="650"><tspan font-weight="700">Ability to pay:</tspan> project spending is plausible</text><text x="98" y="700"><tspan font-weight="700">Reachability:</tspan> legitimate route to a relevant person</text><text x="98" y="750"><tspan font-weight="700">Reason to act:</tspan> consequence, trigger, pain, or timing</text></g><rect x="930" y="455" width="598" height="360" rx="8" fill="#171717"/><text x="956" y="500" font-size="18" font-weight="700" fill="#d6a13a">WORKFLOW BANDS</text><g font-family="Georgia,serif" font-size="23" fill="#f4f4f2"><text x="956" y="560"><tspan font-weight="700" fill="#f5c75b">8–10 · Priority A</tspan></text><text x="956" y="595">Research and contact first.</text><text x="956" y="660"><tspan font-weight="700" fill="#f5c75b">5–7 · Priority B</tspan></text><text x="956" y="695">Resolve the main uncertainty first.</text><text x="956" y="760"><tspan font-weight="700" fill="#f5c75b">0–4 · Priority C</tspan></text><text x="956" y="795">Defer or disqualify unless evidence changes.</text></g><rect x="72" y="860" width="1456" height="265" rx="8" fill="#f4f4f2" stroke="#d9d9d9"/><text x="98" y="905" font-size="18" font-weight="700" fill="#9a641c">CONTACT ROUTE STATUS</text><g font-family="Georgia,serif" font-size="22" fill="#111820"><text x="98" y="955"><tspan font-weight="700">Verified named route:</tspan> relevant person and route supported by a public source.</text><text x="98" y="1005"><tspan font-weight="700">Published general route:</tspan> legitimate business route, but not a named relevant person.</text><text x="98" y="1055"><tspan font-weight="700">Uncertain:</tspan> route could not be verified. Move the prospect down the queue rather than inventing an address.</text></g><text x="72" y="1228" font-family="Arial,sans-serif" font-size="16" fill="#777">The workbook contains 25 reader rows. Scores are prioritization heuristics, not conversion predictions.</text></g></svg>