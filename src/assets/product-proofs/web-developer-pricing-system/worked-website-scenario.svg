<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380"><rect width="1600" height="1380" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">WEB DEVELOPER PRICING SYSTEM · P. 55</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Worked Pricing Scenario</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">A transparent example—not a claimed case study or client result.</text><rect x="72" y="230" width="1456" height="66" rx="6" fill="#edf5ee"/><text x="96" y="271" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">PRODUCTIZED SERVICE-BUSINESS WEBSITE</text><g font-family="Georgia,serif" fill="#111820"><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="72" y="330" width="1456" height="54" fill="#e8eef5"/><text x="92" y="364">STEP</text><text x="590" y="364">DECISION</text></g><g font-size="23"><rect x="72" y="384" width="1456" height="82" fill="#fff" stroke="#ccd3d8"/><text x="92" y="434">Minimum Sustainable Rate</text><text x="610" y="434" font-weight="700">$105 / hour</text><rect x="72" y="466" width="1456" height="100" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="516">Expected effort</text><text x="610" y="506">55 hours across planning, build, communication, QA, revisions, and launch</text><rect x="72" y="566" width="1456" height="82" fill="#fff" stroke="#ccd3d8"/><text x="92" y="616">Direct costs</text><text x="610" y="616" font-weight="700">$225</text><rect x="72" y="648" width="1456" height="92" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="704" font-weight="700">Economic floor</text><text x="610" y="704" font-weight="700">55 × $105 + $225 = $6,000</text><rect x="72" y="740" width="1456" height="92" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="796">Risk</text><text x="610" y="786">Low-to-moderate: familiar work, one decision-maker, content mostly ready</text><rect x="72" y="832" width="1456" height="82" fill="#fff" stroke="#ccd3d8"/><text x="92" y="882">Pricing model</text><text x="610" y="882" font-weight="700">Fixed price</text><rect x="72" y="914" width="1456" height="102" fill="#edf5ee" stroke="#a8c0ad"/><text x="92" y="972" font-weight="700">Commercial price</text><text x="610" y="962" font-weight="700">$7,500</text><text x="610" y="994" font-size="20">after risk, specialization, value context, and desired margin</text><rect x="72" y="1016" width="1456" height="96" fill="#fff" stroke="#ccd3d8"/><text x="92" y="1072">Payment structure</text><text x="610" y="1072">40% start · 30% approved build · 30% before launch</text><rect x="72" y="1112" width="1456" height="96" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="1168">Boundary</text><text x="610" y="1158">Two revision rounds; extra page types and integrations are add-ons</text><rect x="72" y="1240" width="1456" height="80" rx="8" fill="#0b1f33"/><text x="100" y="1290" font-size="21" font-weight="700" fill="#fff">The number changes because the evidence changes—not because the developer feels more confident.</text></g></g><text x="72" y="1350" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Worked scenario recreated as vector text for a sharp product-page preview.</text></svg>