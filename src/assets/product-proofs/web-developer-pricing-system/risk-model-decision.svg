<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340"><rect width="1600" height="1340" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">WEB DEVELOPER PRICING SYSTEM · P. 32</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Price Technical Uncertainty</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Use a response ladder: price it, isolate it, change the model, or decline.</text><g font-family="Georgia,serif" fill="#111820"><g font-family="Arial,sans-serif" font-size="18" font-weight="700"><rect x="72" y="230" width="1456" height="54" fill="#e8eef5"/><text x="92" y="264">RISK</text><text x="470" y="264">LOW</text><text x="850" y="264">MEDIUM</text><text x="1220" y="264">HIGH</text></g><g font-size="20"><rect x="72" y="284" width="1456" height="86" fill="#fff" stroke="#ccd3d8"/><text x="92" y="330" font-weight="700">Requirements</text><text x="470" y="330">Complete</text><text x="850" y="330">Some ambiguity</text><text x="1220" y="330">Still evolving</text><rect x="72" y="370" width="1456" height="86" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="416" font-weight="700">Technology</text><text x="470" y="416">Familiar</text><text x="850" y="416">One unfamiliar area</text><text x="1220" y="416">Major unknowns</text><rect x="72" y="456" width="1456" height="86" fill="#fff" stroke="#ccd3d8"/><text x="92" y="502" font-weight="700">Dependencies</text><text x="470" y="502">Controlled</text><text x="850" y="502">Some third parties</text><text x="1220" y="502">Critical external dependency</text><rect x="72" y="542" width="1456" height="86" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="588" font-weight="700">Stakeholders</text><text x="470" y="588">One decision-maker</text><text x="850" y="588">Several reviewers</text><text x="1220" y="588">Conflicting authority</text><rect x="72" y="628" width="1456" height="86" fill="#fff" stroke="#ccd3d8"/><text x="92" y="674" font-weight="700">Content / data</text><text x="470" y="674">Ready</text><text x="850" y="674">Partial</text><text x="1220" y="674">Unknown or messy</text><rect x="72" y="714" width="1456" height="86" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="760" font-weight="700">Legacy code</text><text x="470" y="760">None</text><text x="850" y="760">Some inherited code</text><text x="1220" y="760">Undocumented system</text><rect x="72" y="842" width="1456" height="356" rx="8" fill="#f7f8fa" stroke="#ccd3d8"/><text x="100" y="892" font-size="25" font-weight="700">Risk response ladder</text><text x="110" y="948" font-size="22">1. Low, familiar variability → normal contingency; fixed price may still fit.</text><text x="110" y="1000" font-size="22">2. Moderate, bounded uncertainty → targeted allowance or explicit assumption.</text><text x="110" y="1052" font-size="22">3. Cheap-to-resolve uncertainty → inspect first or sell paid discovery.</text><text x="110" y="1104" font-size="22">4. High uncertainty that must evolve → T&amp;M, capped T&amp;M, or hybrid phase.</text><text x="110" y="1156" font-size="22">5. Extreme uncertainty + weak cooperation → decline the fixed commitment.</text><rect x="72" y="1222" width="1456" height="72" rx="8" fill="#0b1f33"/><text x="100" y="1268" font-size="21" font-weight="700" fill="#fff">If several categories are high risk, ask “Why am I still using fixed price?”</text></g></g><text x="72" y="1320" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Guide excerpt recreated as vector text for a sharp product-page preview.</text></svg>