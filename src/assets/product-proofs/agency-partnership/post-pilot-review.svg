<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1310" viewBox="0 0 1600 1310"><rect width="100%" height="100%" fill="white"/><text x="26" y="58" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#b98118">Lab 10 - Post-Pilot Review and Partner Decision</text><text x="26" y="125" font-family="Georgia, serif" font-size="34" font-weight="400" fill="#111"><tspan x="26" dy="0">After launch, Jordan and Brightline review the project against the pilot scorecard. The</tspan><tspan x="26" dy="43.52">conversation is not a victory lap. Its purpose is to decide whether the relationship is</tspan><tspan x="26" dy="43.52">worth repeating and what must change first.</tspan></text><rect x="26" y="260" width="510" height="90" fill="#081a33" stroke="#111" stroke-width="2"/><text x="40" y="312" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white">Metric</text><rect x="536" y="260" width="510" height="90" fill="#081a33" stroke="#111" stroke-width="2"/><text x="550" y="312" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white">Pilot result</text><rect x="1046" y="260" width="528" height="90" fill="#081a33" stroke="#111" stroke-width="2"/><text x="1060" y="312" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white"><tspan x="1060" dy="0">Interpretation / next</tspan><tspan x="1060" dy="32.2">change</tspan></text><rect x="26" y="350" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="40" y="390" font-family="Georgia, serif" font-size="26" fill="#111">Estimate accuracy</text><rect x="536" y="350" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="550" y="390" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="550" dy="0">63 hours estimated; 66 total</tspan><tspan x="550" dy="30.68">hours actual</tspan></text><rect x="1046" y="350" width="528" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="1060" y="390" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="1060" dy="0">Within Jordan's tolerance;</tspan><tspan x="1060" dy="30.68">keep estimating method.</tspan></text><rect x="26" y="465" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="40" y="505" font-family="Georgia, serif" font-size="26" fill="#111">Completeness</text><rect x="536" y="465" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="550" y="505" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="550" dy="0">Responsive design states were</tspan><tspan x="550" dy="30.68">incomplete</tspan></text><rect x="1046" y="465" width="528" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="1060" y="505" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="1060" dy="0">Add responsive-state</tspan><tspan x="1060" dy="30.68">requirement to agency intake.</tspan></text><rect x="26" y="580" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="40" y="620" font-family="Georgia, serif" font-size="26" fill="#111">Clarification loops</text><rect x="536" y="580" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="550" y="620" font-family="Georgia, serif" font-size="26" fill="#111">Two material loops</text><rect x="1046" y="580" width="528" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="1060" y="620" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="1060" dy="0">Acceptable; both tied to</tspan><tspan x="1060" dy="30.68">known handoff gaps.</tspan></text><rect x="26" y="695" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="40" y="735" font-family="Georgia, serif" font-size="26" fill="#111">Change control</text><rect x="536" y="695" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="550" y="735" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="550" dy="0">One resource-library request</tspan><tspan x="550" dy="30.68">handled before work</tspan></text><rect x="1046" y="695" width="528" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="1060" y="735" font-family="Georgia, serif" font-size="26" fill="#111">Authority model worked.</text><rect x="26" y="810" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="40" y="850" font-family="Georgia, serif" font-size="26" fill="#111">Communication</text><rect x="536" y="810" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="550" y="850" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="550" dy="0">Twice-weekly status + one</tspan><tspan x="550" dy="30.68">escalation</tspan></text><rect x="1046" y="810" width="528" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="1060" y="850" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="1060" dy="0">Brightline PM reported high</tspan><tspan x="1060" dy="30.68">visibility.</tspan></text><rect x="26" y="925" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="40" y="965" font-family="Georgia, serif" font-size="26" fill="#111">QA</text><rect x="536" y="925" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="550" y="965" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="550" dy="0">Two agency design</tspan><tspan x="550" dy="30.68">corrections; no critical</tspan><tspan x="550" dy="30.68">technical defects</tspan></text><rect x="1046" y="925" width="528" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="1060" y="965" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="1060" dy="0">Layered QA worked; clarify</tspan><tspan x="1060" dy="30.68">one animation state earlier.</tspan></text><rect x="26" y="1040" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="40" y="1080" font-family="Georgia, serif" font-size="26" fill="#111">Payment</text><rect x="536" y="1040" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="550" y="1080" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="550" dy="0">Invoice approved in 2 days;</tspan><tspan x="550" dy="30.68">paid net 15</tspan></text><rect x="1046" y="1040" width="528" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="1060" y="1080" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="1060" dy="0">Matches commercial</tspan><tspan x="1060" dy="30.68">assumption.</tspan></text><rect x="26" y="1155" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="40" y="1195" font-family="Georgia, serif" font-size="26" fill="#111">Strategic decision</text><rect x="536" y="1155" width="510" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="550" y="1195" font-family="Georgia, serif" font-size="26" fill="#111">Both sides want repeat work</text><rect x="1046" y="1155" width="528" height="115" fill="white" stroke="#111" stroke-width="2"/><text x="1060" y="1195" font-family="Georgia, serif" font-size="26" fill="#111"><tspan x="1060" dy="0">Move to MSA + project SOW</tspan><tspan x="1060" dy="30.68">discussion; no retainer yet.</tspan></text></svg>