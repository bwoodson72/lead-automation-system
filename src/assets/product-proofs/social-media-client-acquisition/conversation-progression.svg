<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="1600" height="1260" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">SOCIAL MEDIA CLIENT ACQUISITION · WORKSHEET 19</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Conversation Progression Planner</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Move from context to a sales conversation only when the signal justifies it.</text><rect x="72" y="230" width="1456" height="50" rx="6" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">SIGNAL-STRENGTH PATH</text><g font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle"><g stroke="#d6a72a" stroke-width="2"><rect x="75" y="380" width="205" height="105" rx="12" fill="#f5f7f8"/><rect x="320" y="380" width="205" height="105" rx="12" fill="#f5f7f8"/><rect x="565" y="380" width="205" height="105" rx="12" fill="#fff8e6"/><rect x="810" y="380" width="205" height="105" rx="12" fill="#fff8e6"/><rect x="1055" y="380" width="205" height="105" rx="12" fill="#fff8e6"/><rect x="1300" y="380" width="205" height="105" rx="12" fill="#fff8e6"/></g><text x="177" y="442" fill="#0b1f33">1 · OBSERVE</text><text x="422" y="442" fill="#0b1f33">2 · ACKNOWLEDGE</text><text x="667" y="442" fill="#0b1f33">3 · EXPLORE</text><text x="912" y="442" fill="#0b1f33">4 · CLARIFY</text><text x="1157" y="442" fill="#0b1f33">5 · QUALIFY</text><text x="1402" y="442" fill="#0b1f33">6 · SALES HANDOFF</text></g><g stroke="#d6a72a" stroke-width="5" fill="none"><path d="M280 432H320"/><path d="M525 432H565"/><path d="M770 432H810"/><path d="M1015 432H1055"/><path d="M1260 432H1300"/></g><g font-family="Georgia,serif" fill="#111820"><text x="82" y="610" font-size="25" font-weight="700">Example: buyer says their firm is rebranding and the website no longer fits.</text><text x="92" y="665" font-size="22"><tspan font-weight="700">Explore:</tspan> Ask what changed in the business and what the current site fails to communicate.</text><text x="92" y="710" font-size="22"><tspan font-weight="700">Clarify:</tspan> Learn whether the problem is credibility, differentiation, maintainability, lead quality, or something else.</text><text x="92" y="755" font-size="22"><tspan font-weight="700">Qualify:</tspan> Confirm timing, ownership, scope, and whether solving the problem is actually a priority.</text><text x="92" y="800" font-size="22"><tspan font-weight="700">Handoff:</tspan> Move into a sales process only when the conversation reveals a real project worth discussing.</text><rect x="72" y="900" width="1456" height="185" rx="10" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="950" font-size="22" font-weight="700" fill="#8a6508">GUARDRAIL</text><text x="100" y="1000" font-size="23">A like, follow, or generic compliment is not buying intent. Match the next step to the strongest evidence available.</text><text x="100" y="1042" font-size="23">The goal is not to force every interaction toward a pitch; it is to recognize when commercial movement is justified.</text></g><text x="72" y="1208" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook framework recreated as vector text for a sharp, legible product-page preview.</text></svg>