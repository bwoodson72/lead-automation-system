<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500"><rect width="1600" height="1500" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">WEB DEVELOPER PRICING SYSTEM · PP. 61–62</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Project Pricing Worksheet</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">One record for how the pricing policy was applied to a real opportunity.</text><g font-family="Georgia,serif" fill="#111820"><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="72" y="230" width="1456" height="54" fill="#e8eef5"/><text x="92" y="264">PROJECT INPUT</text><text x="780" y="264">PRICING DECISION</text></g><g font-size="21"><rect x="72" y="284" width="690" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="320" font-weight="700">Desired outcome</text><text x="92" y="352" fill="#68727c">What should be different when the work is done?</text><rect x="72" y="372" width="690" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="408" font-weight="700">Core deliverables</text><text x="92" y="440" fill="#68727c">What is actually included?</text><rect x="72" y="460" width="690" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="496" font-weight="700">Exclusions + client responsibilities</text><text x="92" y="528" fill="#68727c">What must remain outside or client-owned?</text><rect x="72" y="548" width="690" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="584" font-weight="700">Key assumptions</text><text x="92" y="616" fill="#68727c">What must remain true for the estimate to hold?</text><rect x="72" y="636" width="690" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="672" font-weight="700">Estimated total effort + MSR</text><text x="92" y="704" fill="#68727c">Whole engagement, not coding alone.</text><rect x="72" y="724" width="690" height="88" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="760" font-weight="700">Economic floor</text><text x="92" y="792" fill="#68727c">Internal project constraint before commercial judgment.</text><rect x="72" y="812" width="690" height="132" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="848" font-weight="700">Risk review</text><text x="92" y="880" fill="#68727c">Estimate confidence · requirements · technical</text><text x="92" y="912" fill="#68727c">dependencies · stakeholders · content / data</text><rect x="838" y="284" width="690" height="88" fill="#fff" stroke="#ccd3d8"/><text x="858" y="320" font-weight="700">Chosen pricing model</text><text x="858" y="352" fill="#68727c">Fixed · T&amp;M · discovery · retainer · hybrid</text><rect x="838" y="372" width="690" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="858" y="408" font-weight="700">Why the model fits</text><text x="858" y="440" fill="#68727c">How the structure allocates uncertainty.</text><rect x="838" y="460" width="690" height="132" fill="#fff" stroke="#ccd3d8"/><text x="858" y="496" font-weight="700">Commercial context</text><text x="858" y="528" fill="#68727c">Opportunity cost · value context</text><text x="858" y="560" fill="#68727c">specialization / proof · market plausibility</text><rect x="838" y="592" width="690" height="98" fill="#edf5ee" stroke="#a8c0ad"/><text x="858" y="632" font-weight="700">COMMERCIAL PRICE</text><text x="858" y="668" fill="#68727c">The final offer—not a universal markup.</text><rect x="838" y="690" width="690" height="88" fill="#fff" stroke="#ccd3d8"/><text x="858" y="726" font-weight="700">Add-ons + payment structure</text><text x="858" y="758" fill="#68727c">What varies, when cash is collected.</text><rect x="838" y="778" width="690" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="858" y="814" font-weight="700">Quote validity + scheduling conditions</text><text x="858" y="846" fill="#68727c">What must stay true after the quote is issued.</text><rect x="838" y="866" width="690" height="132" fill="#fff" stroke="#ccd3d8"/><text x="858" y="902" font-weight="700">After delivery</text><text x="858" y="934" fill="#68727c">Actual effort · effective project rate</text><text x="858" y="966" fill="#68727c">largest variance · change for next similar quote</text><rect x="72" y="1044" width="1456" height="224" rx="8" fill="#0b1f33"/><text x="100" y="1094" font-size="25" font-weight="700" fill="#fff">The worksheet closes the loop.</text><text x="100" y="1140" font-size="22" fill="#d8dee5">The Personal Pricing Policy supplies the general rules.</text><text x="100" y="1182" font-size="22" fill="#d8dee5">This worksheet records how those rules were applied to one opportunity.</text><text x="100" y="1224" font-size="22" fill="#d8dee5">After delivery, the actual result becomes evidence for the next quote.</text><rect x="72" y="1306" width="1456" height="108" rx="8" fill="#fff8e6" stroke="#d6a72a"/><text x="100" y="1350" font-size="22" font-weight="700">Pricing is not finished when the client says yes.</text><text x="100" y="1388" font-size="21">The system improves only when estimates are compared with real delivery.</text></g></g><text x="72" y="1462" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Worksheet recreated as vector text for a sharp, legible product-page preview.</text></svg>