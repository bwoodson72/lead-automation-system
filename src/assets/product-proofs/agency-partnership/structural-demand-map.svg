<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1185" viewBox="0 0 1600 1185"><rect width="100%" height="100%" fill="white"/><text x="28" y="55" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#b98118">Running example: Brightline Creative</text><rect x="28" y="92" width="1544" height="330" fill="#e9f3ec"/><text x="50" y="140" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#081a33">Applied example</text><text x="50" y="185" font-family="Georgia, serif" font-size="34" font-weight="400" fill="#111"><tspan x="50" dy="0">Brightline has six employees: two designers, one strategist, one account manager, one</tspan><tspan x="50" dy="43.52">paid-media specialist, and the founder. It sells websites and campaigns but has no permanent</tspan><tspan x="50" dy="43.52">developer. Some months it needs almost no code; other months two website builds and three</tspan><tspan x="50" dy="43.52">landing pages overlap. Jordan's opportunity is not 'Brightline needs a developer.' It is</tspan><tspan x="50" dy="43.52">'Brightline has irregular implementation demand that is too important to improvise and too</tspan><tspan x="50" dy="43.52">uneven to justify full-time headcount.'</tspan></text><text x="28" y="520" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#b98118">Agency Demand Map</text><text x="28" y="585" font-family="Georgia, serif" font-size="33" font-weight="400" fill="#111"><tspan x="28" dy="0">Translate an agency service into the technical demand and operating reason outside</tspan><tspan x="28" dy="39.6">capacity could exist.</tspan></text><rect x="28" y="650" width="390" height="92" fill="#081a33" stroke="#111" stroke-width="2"/><text x="42" y="698" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white"><tspan x="42" dy="0">Agency service</tspan></text><rect x="418" y="650" width="390" height="92" fill="#081a33" stroke="#111" stroke-width="2"/><text x="432" y="698" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white"><tspan x="432" dy="0">Technical work created</tspan></text><rect x="808" y="650" width="390" height="92" fill="#081a33" stroke="#111" stroke-width="2"/><text x="822" y="698" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white"><tspan x="822" dy="0">Why demand varies</tspan></text><rect x="1198" y="650" width="374" height="92" fill="#081a33" stroke="#111" stroke-width="2"/><text x="1212" y="698" font-family="Georgia, serif" font-size="28" font-weight="700" fill="white"><tspan x="1212" dy="0">Potential partner role</tspan></text><rect x="28" y="742" width="390" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="42" y="784" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="42" dy="0">Brand + website design</tspan></text><rect x="418" y="742" width="390" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="432" y="784" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="432" dy="0">Production website</tspan><tspan x="432" dy="33.6">implementation</tspan></text><rect x="808" y="742" width="390" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="822" y="784" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="822" dy="0">Project-based sales</tspan><tspan x="822" dy="33.6">create uneven build</tspan><tspan x="822" dy="33.6">volume</tspan></text><rect x="1198" y="742" width="374" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="1212" y="784" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="1212" dy="0">Design-to-code</tspan><tspan x="1212" dy="33.6">implementation partner</tspan></text><rect x="28" y="872" width="390" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="42" y="914" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="42" dy="0">SEO retainers</tspan></text><rect x="418" y="872" width="390" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="432" y="914" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="432" dy="0">Technical fixes,</tspan><tspan x="432" dy="33.6">templates, migrations</tspan></text><rect x="808" y="872" width="390" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="822" y="914" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="822" dy="0">Findings appear across</tspan><tspan x="822" dy="33.6">client portfolios</tspan></text><rect x="1198" y="872" width="374" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="1212" y="914" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="1212" dy="0">Technical SEO</tspan><tspan x="1212" dy="33.6">implementation</tspan><tspan x="1212" dy="33.6">specialist</tspan></text><rect x="28" y="1002" width="390" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="42" y="1044" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="42" dy="0">PPC/campaigns</tspan></text><rect x="418" y="1002" width="390" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="432" y="1044" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="432" dy="0">Landing pages, forms,</tspan><tspan x="432" dy="33.6">analytics</tspan></text><rect x="808" y="1002" width="390" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="822" y="1044" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="822" dy="0">Campaign launches</tspan><tspan x="822" dy="33.6">create deadline spikes</tspan></text><rect x="1198" y="1002" width="374" height="130" fill="white" stroke="#111" stroke-width="2"/><text x="1212" y="1044" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#111"><tspan x="1212" dy="0">Landing-page capacity</tspan><tspan x="1212" dy="33.6">partner</tspan></text></svg>