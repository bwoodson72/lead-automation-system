<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1556" viewBox="0 0 1600 1556"><rect width="100%" height="100%" fill="#fff"/><text x="64" y="68" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c79a42">DEVELOPER PROPOSAL &amp; CLOSING KIT  |  WORKBOOK PC27 · P. 55</text><text x="64" y="126" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0b1f33">One-Page Closing SOP</text><text x="64" y="176" font-family="Georgia, serif" font-size="26" fill="#34495e">Condense the entire proposal-to-close system into a sequence another competent operator can</text><text x="64" y="210" font-family="Georgia, serif" font-size="26" fill="#34495e">follow.</text><rect x="64" y="202" width="1472" height="48" rx="4" fill="#edf6ee"/><text x="84" y="233" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#356b45">REDWOOD ROOFING - WORKED EXAMPLE</text><rect x="64" y="260" width="1472" height="76" fill="#0b1f33"/><line x1="444" y1="260" x2="444" y2="336" stroke="#32475a" stroke-width="2"/><text x="82" y="306" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#fff">Prompt / decision</text><text x="462" y="306" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#fff">Worked answer</text><rect x="64" y="336" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="336" x2="444" y2="446" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="370" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">GATE</text><text x="462" y="370" font-family="Georgia, serif" font-size="22" fill="#101820">Confirm problem, outcome, authority, commercial fit, timing,</text><text x="462" y="400" font-family="Georgia, serif" font-size="22" fill="#101820">dependencies, decision process, risk visibility and mutual effort.</text><rect x="64" y="446" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="446" x2="444" y2="556" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="480" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">SYNTHESIZE</text><text x="462" y="480" font-family="Georgia, serif" font-size="22" fill="#101820">Turn discovery into condition, consequence, evidence, future state,</text><text x="462" y="510" font-family="Georgia, serif" font-size="22" fill="#101820">intervention, observation and external variables.</text><rect x="64" y="556" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="556" x2="444" y2="666" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="590" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">SCOPE</text><text x="462" y="590" font-family="Georgia, serif" font-size="22" fill="#101820">Bound deliverables, quantities, acceptance, responsibilities,</text><text x="462" y="620" font-family="Georgia, serif" font-size="22" fill="#101820">assumptions, exclusions and change triggers.</text><rect x="64" y="666" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="666" x2="444" y2="776" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="700" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">RISK</text><text x="462" y="700" font-family="Georgia, serif" font-size="22" fill="#101820">Classify unknowns; investigate, discover, assume, exclude, change</text><text x="462" y="730" font-family="Georgia, serif" font-size="22" fill="#101820">pricing model or decline.</text><rect x="64" y="776" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="776" x2="444" y2="886" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="810" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">PRICE</text><text x="462" y="810" font-family="Georgia, serif" font-size="22" fill="#101820">Apply pricing policy, walk-away number, real option logic and payment</text><text x="462" y="840" font-family="Georgia, serif" font-size="22" fill="#101820">structure.</text><rect x="64" y="886" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="886" x2="444" y2="996" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="920" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">PROPOSE</text><text x="462" y="920" font-family="Georgia, serif" font-size="22" fill="#101820">Build a nine-section decision document from the authoritative commercial</text><text x="462" y="950" font-family="Georgia, serif" font-size="22" fill="#101820">summary.</text><rect x="64" y="996" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="996" x2="444" y2="1106" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1030" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">PRESENT</text><text x="462" y="1030" font-family="Georgia, serif" font-size="22" fill="#101820">Reconfirm the deal, surface concerns, diagnose objections and end with a</text><text x="462" y="1060" font-family="Georgia, serif" font-size="22" fill="#101820">specific decision event.</text><rect x="64" y="1106" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="1106" x2="444" y2="1216" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1140" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">CONTROL</text><text x="462" y="1140" font-family="Georgia, serif" font-size="22" fill="#101820">Version material revisions; reopen discovery when the buyer creates a</text><text x="462" y="1170" font-family="Georgia, serif" font-size="22" fill="#101820">different project.</text><rect x="64" y="1216" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="1216" x2="444" y2="1326" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1250" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">EXECUTE</text><text x="462" y="1250" font-family="Georgia, serif" font-size="22" fill="#101820">Correct agreement/SOW + required payment before Closed Won or capacity</text><text x="462" y="1280" font-family="Georgia, serif" font-size="22" fill="#101820">reservation.</text><rect x="64" y="1326" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="1326" x2="444" y2="1436" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1360" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">HANDOFF + LEARN</text><text x="462" y="1360" font-family="Georgia, serif" font-size="22" fill="#101820">Transfer objective/assumptions/risks into delivery; compare expected vs</text><text x="462" y="1390" font-family="Georgia, serif" font-size="22" fill="#101820">actual and update the system from evidence.</text><text x="64" y="1516" font-family="Arial, sans-serif" font-size="18" fill="#7b8791">Workbook excerpt recreated as vector text for legible product-page preview.</text></svg>