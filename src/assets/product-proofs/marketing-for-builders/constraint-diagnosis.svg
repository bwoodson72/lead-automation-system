<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="#f7f5ef"/>
<rect width="1600" height="150" fill="#0b0b0c"/>
<rect y="146" width="1600" height="4" fill="#c99522"/>
<foreignObject x="0" y="0" width="1600" height="900">
<div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Arial,Helvetica,sans-serif;color:#191919;">
  <div style="height:150px;box-sizing:border-box;padding:34px 70px 0 70px;color:#fff;">
    <div style="font-size:24px;font-weight:700;color:#c99522;letter-spacing:.02em;">DEVELOPER BUSINESS LAB</div>
    <div style="font-size:40px;font-weight:800;line-height:1.05;margin-top:14px;">Constraint Diagnosis &amp; Improvement Experiment</div>
    <div style="font-size:18px;color:#d7d7d7;margin-top:4px;">Re-composed from Workbook Module 18 for web readability</div>
  </div>
  <div style="padding:36px 70px 40px 70px;box-sizing:border-box;"><div style="padding:0 0 14px 0;margin:0 0 14px 0;border-bottom:1px solid #d8d2c5;">
<div style="font-size:16px;font-weight:800;color:#c58c12;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px;">Initial explanation</div>
<div style="font-size:22px;line-height:1.35;">Low inquiry volume means the content topics are too narrow or weak.</div></div><div style="padding:0 0 14px 0;margin:0 0 14px 0;border-bottom:1px solid #d8d2c5;">
<div style="font-size:16px;font-weight:800;color:#c58c12;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px;">Best-supported current constraint</div>
<div style="font-size:22px;line-height:1.35;">Strong buyer-facing evidence has too few relevant opportunities to travel through the already-selected ERP/IT relationship route.</div></div><div style="padding:0 0 14px 0;margin:0 0 14px 0;border-bottom:1px solid #d8d2c5;">
<div style="font-size:16px;font-weight:800;color:#c58c12;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px;">Competing explanations retained</div>
<div style="font-size:22px;line-height:1.35;">Episodic demand; partner-selection effects; small-sample uncertainty; possible argument weaknesses not yet exposed.</div></div><div style="padding:0 0 14px 0;margin:0 0 14px 0;border-bottom:1px solid #d8d2c5;">
<div style="font-size:16px;font-weight:800;color:#c58c12;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px;">Corrective hypothesis</div>
<div style="font-size:22px;line-height:1.35;">More deliberate use of the existing evidence in relevant ERP/IT relationship contexts should create more forwarding, discussion, and qualified-evaluation opportunities; repeated lack of such movement would weaken the access hypothesis.</div></div><div style="padding:0 0 14px 0;margin:0 0 14px 0;border-bottom:1px solid #d8d2c5;">
<div style="font-size:16px;font-weight:800;color:#c58c12;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px;">Primary change</div>
<div style="font-size:22px;line-height:1.35;">Context-specific operation with four existing ERP/IT contacts using the Integration Handoff Brief and existing proof assets.</div></div><div style="padding:0 0 14px 0;margin:0 0 14px 0;border-bottom:1px solid #d8d2c5;">
<div style="font-size:16px;font-weight:800;color:#c58c12;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px;">Interpretation</div>
<div style="font-size:22px;line-height:1.35;">The partner access behavior earns continued deliberate operation and weakens the urgency of rewriting content first. The result is not causal proof or a predictable channel rate.</div></div></div>
</div>
</foreignObject>
</svg>