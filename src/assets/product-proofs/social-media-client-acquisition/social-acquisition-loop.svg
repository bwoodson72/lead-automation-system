<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="1600" height="1260" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">SOCIAL MEDIA CLIENT ACQUISITION · GUIDE FRAMEWORK</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">The Social Acquisition Loop</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Treat social media as a commercial system, not a publishing habit.</text><rect x="72" y="230" width="1456" height="50" rx="6" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">CORE PATHWAY</text><g font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle"><g fill="#0b1f33" stroke="#d6a72a" stroke-width="3"><rect x="85" y="390" width="250" height="120" rx="14" fill="#fff8e6"/><rect x="375" y="390" width="250" height="120" rx="14" fill="#fff8e6"/><rect x="665" y="390" width="250" height="120" rx="14" fill="#fff8e6"/><rect x="955" y="390" width="250" height="120" rx="14" fill="#fff8e6"/><rect x="1245" y="390" width="250" height="120" rx="14" fill="#fff8e6"/></g><text x="210" y="460" fill="#0b1f33">INSIGHT</text><text x="500" y="460" fill="#0b1f33">RELEVANCE</text><text x="790" y="460" fill="#0b1f33">TRUST</text><text x="1080" y="460" fill="#0b1f33">CONVERSATION</text><text x="1370" y="460" fill="#0b1f33">PIPELINE</text></g><g stroke="#d6a72a" stroke-width="5" fill="none"><path d="M335 450H375"/><path d="M625 450H665"/><path d="M915 450H955"/><path d="M1205 450H1245"/><path d="M1370 520 C1370 760 250 760 210 520"/></g><g font-family="Georgia,serif" fill="#111820"><text x="92" y="640" font-size="25" font-weight="700">What the loop changes</text><text x="92" y="690" font-size="23">Market evidence shapes who you target and what problems you discuss.</text><text x="92" y="735" font-size="23">Buyer-relevant content and proof reduce uncertainty before a sales conversation.</text><text x="92" y="780" font-size="23">Relationships and buying signals determine when a conversation is commercially justified.</text><text x="92" y="825" font-size="23">Pipeline and attribution data feed the next round of market insight instead of vanity metrics.</text><rect x="72" y="900" width="1456" height="180" rx="10" fill="#f5f7f8" stroke="#ccd3d8"/><text x="100" y="950" font-size="22" font-weight="700">Decision rule</text><text x="100" y="1000" font-size="23">Do not optimize the loudest metric. Diagnose where commercially relevant movement breaks down,</text><text x="100" y="1042" font-size="23">then improve that stage and run the loop again.</text></g><text x="72" y="1208" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Framework recreated as vector text for a sharp, legible product-page preview.</text></svg>