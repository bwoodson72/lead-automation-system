<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1436" viewBox="0 0 1600 1436"><rect width="100%" height="100%" fill="#fff"/><text x="64" y="68" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c79a42">DEVELOPER PROPOSAL &amp; CLOSING KIT  |  WORKBOOK PC05 · P. 11</text><text x="64" y="126" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0b1f33">Scope Module</text><text x="64" y="176" font-family="Georgia, serif" font-size="26" fill="#34495e">Turn an outcome into bounded deliverables, quantities, acceptance conditions, client inputs,</text><text x="64" y="210" font-family="Georgia, serif" font-size="26" fill="#34495e">exclusions and change triggers.</text><rect x="64" y="202" width="1472" height="48" rx="4" fill="#edf6ee"/><text x="84" y="233" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#356b45">REDWOOD ROOFING - WORKED EXAMPLE</text><rect x="64" y="260" width="1472" height="76" fill="#0b1f33"/><line x1="444" y1="260" x2="444" y2="336" stroke="#32475a" stroke-width="2"/><text x="82" y="306" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#fff">Prompt / decision</text><text x="462" y="306" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#fff">Worked answer</text><rect x="64" y="336" width="1472" height="100" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="336" x2="444" y2="436" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="370" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Module name</text><text x="462" y="370" font-family="Georgia, serif" font-size="22" fill="#101820">Redwood service-focused marketing site</text><rect x="64" y="436" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="436" x2="444" y2="546" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="470" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Business purpose</text><text x="462" y="470" font-family="Georgia, serif" font-size="22" fill="#101820">Make commercial and priority residential services easier to understand</text><text x="462" y="500" font-family="Georgia, serif" font-size="22" fill="#101820">and connect paid traffic to relevant proof and inquiry paths.</text><rect x="64" y="546" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="546" x2="444" y2="656" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="580" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Deliverable definition</text><text x="462" y="580" font-family="Georgia, serif" font-size="22" fill="#101820">Information architecture, design/implementation, reusable CMS</text><text x="462" y="610" font-family="Georgia, serif" font-size="22" fill="#101820">structures, forms, migration, analytics and launch.</text><rect x="64" y="656" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="656" x2="444" y2="766" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="690" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Quantity / limit</text><text x="462" y="690" font-family="Georgia, serif" font-size="22" fill="#101820">Up to 10 marketing pages; migration of up to 25 approved content items;</text><text x="462" y="720" font-family="Georgia, serif" font-size="22" fill="#101820">five analytics events.</text><rect x="64" y="766" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="766" x2="444" y2="876" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="800" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Included states /</text><text x="82" y="830" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">features</text><text x="462" y="800" font-family="Georgia, serif" font-size="22" fill="#101820">Responsive pages, primary estimate form + service variations, CMS</text><text x="462" y="830" font-family="Georgia, serif" font-size="22" fill="#101820">editing, production launch.</text><rect x="64" y="876" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="876" x2="444" y2="986" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="910" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Acceptance condition</text><text x="462" y="910" font-family="Georgia, serif" font-size="22" fill="#101820">Pages accessible on approved paths; forms validate and deliver; CMS</text><text x="462" y="940" font-family="Georgia, serif" font-size="22" fill="#101820">fields publish; analytics events verify; no severity-one launch defects.</text><rect x="64" y="986" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="986" x2="444" y2="1096" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1020" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Client input required</text><text x="462" y="1020" font-family="Georgia, serif" font-size="22" fill="#101820">Approved copy/images/legal language; hosting/domain and analytics</text><text x="462" y="1050" font-family="Georgia, serif" font-size="22" fill="#101820">access; consolidated feedback and milestone approvals.</text><rect x="64" y="1096" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="1096" x2="444" y2="1206" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1130" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Explicit exclusions</text><text x="462" y="1130" font-family="Georgia, serif" font-size="22" fill="#101820">Copywriting, photography, CRM integration, paid media, ongoing SEO,</text><text x="462" y="1160" font-family="Georgia, serif" font-size="22" fill="#101820">unlimited post-launch maintenance.</text><rect x="64" y="1206" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="1206" x2="444" y2="1316" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1240" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Change triggers</text><text x="462" y="1240" font-family="Georgia, serif" font-size="22" fill="#101820">New pages/integrations, quantity increases, changed approved</text><text x="462" y="1270" font-family="Georgia, serif" font-size="22" fill="#101820">architecture, or redoing previously approved direction.</text><text x="64" y="1396" font-family="Arial, sans-serif" font-size="18" fill="#7b8791">Workbook excerpt recreated as vector text for legible product-page preview.</text></svg>