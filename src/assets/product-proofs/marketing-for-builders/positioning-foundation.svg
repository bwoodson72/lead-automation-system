<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="1600" height="1260" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">MARKETING FOR BUILDERS · WORKBOOK P. 3</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Positioning Foundation</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Turn broad capability into a market-facing position a buyer can recognize.</text><rect x="72" y="230" width="1456" height="50" rx="6" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">FICTIONAL RUNNING EXAMPLE · COMPLETED MODEL</text><g font-family="Georgia,serif" fill="#111820"><text x="82" y="340" font-size="21" font-weight="700">BUYER</text><text x="400" y="340" font-size="23">Established local or regional home-service companies with enough operating scale for a professional custom site.</text><line x1="72" y1="375" x2="1528" y2="375" stroke="#d7dce0"/><text x="82" y="430" font-size="21" font-weight="700">PROBLEM CATEGORY</text><text x="400" y="430" font-size="23">The current site no longer supports trust and confident inquiry behavior as well as the business needs.</text><line x1="72" y1="465" x2="1528" y2="465" stroke="#d7dce0"/><text x="82" y="520" font-size="21" font-weight="700">SOLUTION CATEGORY</text><text x="400" y="520" font-size="23">Custom lead-generation website engagement.</text><line x1="72" y1="555" x2="1528" y2="555" stroke="#d7dce0"/><text x="82" y="610" font-size="21" font-weight="700">MEANINGFUL DISTINCTION</text><text x="400" y="610" font-size="23">Credibility, fast mobile use, structured expansion, and clear paths to contact.</text><rect x="72" y="680" width="1456" height="250" rx="10" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="730" font-size="22" font-weight="700" fill="#8a6508">POSITIONING SENTENCE</text><text x="100" y="790" font-size="30" font-weight="700" fill="#0b1f33">I help established home-service companies replace weak websites</text><text x="100" y="840" font-size="30" font-weight="700" fill="#0b1f33">with custom lead-generation sites built around credibility, fast mobile</text><text x="100" y="890" font-size="30" font-weight="700" fill="#0b1f33">use, and clear paths to contact.</text><rect x="72" y="975" width="1456" height="140" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="100" y="1020" font-size="22" font-weight="700">Carry-forward rule</text><text x="100" y="1063" font-size="22">Buyer + problem + solution + distinction become the inputs for the message hierarchy, proof, content,</text><text x="100" y="1102" font-size="22">distribution, and later measurement. The decision is recorded once and reused.</text></g><text x="72" y="1208" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>