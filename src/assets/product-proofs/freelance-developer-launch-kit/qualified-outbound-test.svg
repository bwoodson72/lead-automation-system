<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#ffffff"/><rect width="1600" height="170" fill="#081523"/><rect y="166" width="1600" height="4" fill="#d6a72a"/><text x="72" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d6a72a">FREELANCE DEVELOPER LAUNCH KIT · WORKSHEET 20 · WORKBOOK P. 45</text><text x="72" y="116" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#ffffff">Qualified Outbound Test</text><text x="72" y="151" font-family="Georgia,serif" font-size="22" fill="#d6dce3">Interpret market contact by stage instead of treating reply rate as the whole story.</text><text x="72" y="220" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#365f45">ALEX MORGAN · FIRST BOUNDED EVIDENCE CYCLE</text><g font-family="Arial,sans-serif"><rect x="72" y="255" width="300" height="140" rx="10" fill="#f6f7f8" stroke="#ccd3d8"/><text x="96" y="294" font-size="17" font-weight="700" fill="#26323d">Organizations reviewed</text><text x="96" y="351" font-size="42" font-weight="700" fill="#0b1f33">30</text><rect x="404" y="255" width="300" height="140" rx="10" fill="#f6f7f8" stroke="#ccd3d8"/><text x="428" y="294" font-size="17" font-weight="700" fill="#26323d">Qualified + contacted</text><text x="428" y="351" font-size="42" font-weight="700" fill="#0b1f33">18</text><rect x="736" y="255" width="300" height="140" rx="10" fill="#f6f7f8" stroke="#ccd3d8"/><text x="760" y="294" font-size="17" font-weight="700" fill="#26323d">Replies</text><text x="760" y="351" font-size="42" font-weight="700" fill="#0b1f33">6</text><rect x="1068" y="255" width="460" height="140" rx="10" fill="#edf5ee" stroke="#a8c0ad"/><text x="1092" y="294" font-size="17" font-weight="700" fill="#365f45">Substantive conversations</text><text x="1092" y="351" font-size="42" font-weight="700" fill="#365f45">3</text><path d="M372 325 H404 M704 325 H736 M1036 325 H1068" stroke="#d6a72a" stroke-width="4"/><rect x="72" y="435" width="700" height="300" rx="10" fill="#f7f8fa" stroke="#ccd3d8"/><text x="100" y="478" font-size="21" font-weight="700" fill="#26323d">Evidence that became stronger</text><text x="100" y="525" font-size="20" fill="#303b45">• Expansion / new-location situations created better conversations.</text><text x="100" y="570" font-size="20" fill="#303b45">• Vendor dependence and publishing control appeared in buyer language.</text><text x="100" y="615" font-size="20" fill="#303b45">• Generic “old website” criticism was less useful.</text><text x="100" y="670" font-size="18" fill="#6b747c">The cycle changed the message toward expansion and publishing control.</text><rect x="828" y="435" width="700" height="300" rx="10" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="856" y="478" font-size="21" font-weight="700" fill="#6c5109">Evidence that did NOT exist yet</text><text x="856" y="525" font-size="20" fill="#303b45">• No stable conversion benchmark.</text><text x="856" y="570" font-size="20" fill="#303b45">• No proof that nonresponses meant “no demand.”</text><text x="856" y="615" font-size="20" fill="#303b45">• No reason to increase volume before understanding mismatches.</text><text x="856" y="670" font-size="18" fill="#6b747c">Small-sample counts are evidence inputs, not performance claims.</text><rect x="72" y="775" width="1456" height="112" rx="10" fill="#081523"/><text x="100" y="818" font-size="20" font-weight="700" fill="#d6a72a">NEXT SMALLEST CHANGE</text><text x="100" y="858" font-size="24" fill="#ffffff">Investigate why substantive conversations diverged from mismatches before increasing volume or changing the price.</text></g><text x="72" y="946" font-family="Arial,sans-serif" font-size="16" fill="#77818a">Readable proof excerpt reconstructed from the production-final workbook.</text></svg>