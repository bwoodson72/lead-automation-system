<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500"><rect width="100%" height="100%" fill="#fff"/><text x="64" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c79a42">CLIENT ACQUISITION WITHOUT UPWORK  |  CHAPTER 46</text><text x="64" y="132" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0b1f33">Build Your Client Acquisition Operating System</text><text x="64" y="190" font-family="Georgia, sans-serif" font-size="30" font-weight="700" fill="#183b5b">At the end of the sprint, convert what you learned into one page you can actually operate.</text><rect x="64" y="235" width="1470" height="1120" rx="8" fill="#eaf1f7"/><text x="100" y="285" font-family="Georgia, sans-serif" font-size="26" font-weight="700" fill="#c79a42">CLIENT ACQUISITION OPERATING SYSTEM</text><text x="100" y="345" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Primary offer: ______</text><text x="100" y="427" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Target customer: ______</text><text x="100" y="509" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Problem I look for: ______</text><text x="100" y="591" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Observable signals: ______</text><text x="100" y="673" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Disqualifiers: ______</text><text x="100" y="755" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Priority fit-score threshold: ___ /14</text><text x="100" y="837" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Primary direct channel: ______</text><text x="100" y="919" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Relationship channel: ______</text><text x="100" y="1001" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Lead sources: ______</text><text x="100" y="1083" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Weekly candidate target: ______</text><text x="100" y="1165" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Weekly qualified-prospect target: ______</text><text x="820" y="345" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Research process: ______</text><text x="820" y="427" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Initial contact approach: ______</text><text x="820" y="509" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Follow-up process: ______</text><text x="820" y="591" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Referral process: ______</text><text x="820" y="673" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Partner strategy: ______</text><text x="820" y="755" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Pipeline stages: ______</text><text x="820" y="837" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Metrics reviewed weekly: ______</text><text x="820" y="919" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Continue-channel rule: ______</text><text x="820" y="1001" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Modify-channel rule: ______</text><text x="820" y="1083" font-family="Georgia, sans-serif" font-size="28" font-weight="700" fill="#0b1f33">Stop-channel rule: ______</text><text x="64" y="1420" font-family="Georgia, serif" font-size="28" font-weight="400" fill="#101820"><tspan x="64" dy="0">A good acquisition system does not eliminate uncertainty. It makes your actions visible enough to learn from it.</tspan></text></svg>