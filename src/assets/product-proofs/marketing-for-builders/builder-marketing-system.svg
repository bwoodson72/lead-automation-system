<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420"><rect width="1600" height="1420" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">MARKETING FOR BUILDERS · WORKBOOK PP. 26 + 29</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Builder Marketing System</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">The final operating system carries the same decisions from positioning through measurement.</text><rect x="72" y="230" width="1456" height="50" rx="6" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">FICTIONAL RUNNING EXAMPLE · COMPLETED SYSTEM</text><g font-family="Georgia,serif" fill="#111820"><text x="82" y="330" font-size="20" font-weight="700">PRIMARY BUYER</text><text x="390" y="330" font-size="23">Established home-service companies.</text><line x1="72" y1="365" x2="1528" y2="365" stroke="#d7dce0"/><text x="82" y="415" font-size="20" font-weight="700">PROBLEM</text><text x="390" y="415" font-size="23">Current site no longer supports trust and confident inquiry behavior.</text><line x1="72" y1="450" x2="1528" y2="450" stroke="#d7dce0"/><text x="82" y="500" font-size="20" font-weight="700">POSITION</text><text x="390" y="500" font-size="23">Custom lead-generation websites for established service businesses.</text><line x1="72" y1="535" x2="1528" y2="535" stroke="#d7dce0"/><text x="82" y="585" font-size="20" font-weight="700">PROOF</text><text x="390" y="585" font-size="22">Two evidence-rich case studies, measured technical evidence where available, client comments.</text><line x1="72" y1="620" x2="1528" y2="620" stroke="#d7dce0"/><text x="82" y="670" font-size="20" font-weight="700">CONTENT</text><text x="390" y="670" font-size="22">Problem-recognition, decision, proof, and process assets around recurring buyer questions.</text><line x1="72" y1="705" x2="1528" y2="705" stroke="#d7dce0"/><text x="82" y="755" font-size="20" font-weight="700">CAPTURE</text><text x="390" y="755" font-size="22">Practical website improvement guide + useful email updates.</text><line x1="72" y1="790" x2="1528" y2="790" stroke="#d7dce0"/><text x="82" y="840" font-size="20" font-weight="700">DISTRIBUTION</text><text x="390" y="840" font-size="22">Owned site / search + one professional or local relationship channel.</text><line x1="72" y1="875" x2="1528" y2="875" stroke="#d7dce0"/><text x="82" y="925" font-size="20" font-weight="700">NURTURE</text><text x="390" y="925" font-size="22">Sustainable useful updates—not a daily newsletter obligation.</text><line x1="72" y1="960" x2="1528" y2="960" stroke="#d7dce0"/><text x="82" y="1010" font-size="20" font-weight="700">SUPPORT ASSETS</text><text x="390" y="1010" font-size="22">Clear referral description, offer page, case study, problem article, process page, relevant proof.</text><line x1="72" y1="1045" x2="1528" y2="1045" stroke="#d7dce0"/><text x="82" y="1095" font-size="20" font-weight="700">MEASUREMENT</text><text x="390" y="1095" font-size="22">Inquiry source, influential assets, qualified opportunities, influenced pipeline.</text><rect x="72" y="1150" width="1456" height="150" rx="10" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="1198" font-size="22" font-weight="700" fill="#8a6508">NEXT ASSET</text><text x="100" y="1245" font-size="27" font-weight="700" fill="#0b1f33">Objection page based on repeated sales questions.</text><text x="100" y="1282" font-size="19" fill="#68727c">The next build comes from evidence about buyer uncertainty—not from adding another channel.</text></g><text x="72" y="1368" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpts recreated as vector text for a sharp, legible product-page preview.</text></svg>