<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600">
  <rect width="1400" height="1600" fill="#ffffff"/>
  <rect width="1400" height="150" fill="#0a0a0a"/>
  <text x="28" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#d6a13a">DEVELOPER BUSINESS LAB | AGENCY PARTNERSHIP PLAYBOOK</text>
  <text x="28" y="118" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#f4f4f2">AP24 · Relationship Response and Closeout Decision</text>
  <text x="1035" y="42" font-family="Arial, sans-serif" font-size="17" fill="#c7c7c3">PRODUCTION-FINAL WORKBOOK EXCERPT</text>

  <rect x="28" y="205" width="1344" height="128" rx="16" fill="#f4f4f2" stroke="#d7d7d3"/>
  <text x="62" y="258" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#171717">Use the least destructive response that actually fixes the mechanism.</text>
  <text x="62" y="302" font-family="Arial, sans-serif" font-size="21" fill="#424242">Continue, Reset, Reprice, Reduce, Pause, Exit, or route the issue to Qualified Review.</text>

  <text x="28" y="400" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#7a4f13">WORKED EXAMPLE · BRIGHTLINE RESPONSE DECISION</text>

  <g font-family="Arial, sans-serif">
    <rect x="28" y="445" width="1344" height="112" rx="12" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="490" font-size="23" font-weight="700" fill="#171717">AP23 economics</text>
    <text x="385" y="490" font-size="23" fill="#171717">Watch</text>
    <text x="385" y="530" font-size="20" fill="#555555">Relationship clears the fictional floor, but 9 h of speculative technical estimating is deteriorating.</text>

    <rect x="28" y="574" width="1344" height="112" rx="12" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="619" font-size="23" font-weight="700" fill="#171717">AP22 portfolio</text>
    <text x="385" y="619" font-size="23" fill="#171717">Watch</text>
    <text x="385" y="659" font-size="20" fill="#555555">Brightline is material, but the loss stress test remains manageable. Do not expand automatically.</text>

    <rect x="28" y="703" width="1344" height="112" rx="12" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="748" font-size="23" font-weight="700" fill="#171717">Repairability Test</text>
    <text x="385" y="748" font-size="23" fill="#171717">Pass</text>
    <text x="385" y="788" font-size="20" fill="#555555">The presales mechanism is identifiable, controllable, observable, and worth repairing.</text>

    <rect x="28" y="832" width="1344" height="156" rx="16" fill="#eef4ed" stroke="#bad0b8"/>
    <text x="62" y="886" font-size="25" font-weight="700" fill="#285b2d">PRIMARY RESPONSE: RESET</text>
    <text x="62" y="932" font-size="21" fill="#171717">Core repeat delivery is working. The relationship does not need a broad reprice or exit.</text>
    <text x="62" y="969" font-size="20" fill="#555555">Existing accepted project work stays under the current SOW and operating process.</text>

    <rect x="28" y="1016" width="1344" height="300" rx="16" fill="#fff7df" stroke="#d6a13a"/>
    <text x="62" y="1072" font-size="24" font-weight="700" fill="#7a4f13">BRIGHTLINE CHANGE PACKAGE</text>
    <text x="62" y="1120" font-size="21" font-weight="700" fill="#171717">Keep:</text>
    <text x="175" y="1120" font-size="21" fill="#171717">A bounded fit and feasibility check.</text>
    <text x="62" y="1170" font-size="21" font-weight="700" fill="#171717">Change:</text>
    <text x="175" y="1170" font-size="21" fill="#171717">Deeper project-specific technical review must be separately approved before work begins.</text>
    <text x="175" y="1210" font-size="19" fill="#555555">Examples: estimate-building, architecture review, integration validation, or paid discovery.</text>
    <text x="62" y="1260" font-size="21" font-weight="700" fill="#171717">Next evidence:</text>
    <text x="225" y="1260" font-size="21" fill="#171717">Track the next request, approval route, hours consumed, and whether it becomes authorized work.</text>

    <rect x="28" y="1350" width="1344" height="170" rx="16" fill="#f4f4f2" stroke="#d7d7d3"/>
    <text x="62" y="1404" font-size="23" font-weight="700" fill="#171717">Why it matters</text>
    <text x="62" y="1450" font-size="21" fill="#171717">A profitable relationship can still contain a deteriorating operating mechanism.</text>
    <text x="62" y="1490" font-size="21" fill="#171717">The response should preserve what works while correcting the part that does not.</text>
  </g>
</svg>