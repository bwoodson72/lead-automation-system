<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500"><rect width="1600" height="1500" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">WEB DEVELOPER PRICING SYSTEM · CURRENT WORKBOOK</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Master Project Pricing Worksheet</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">One reusable record that keeps project pricing decisions in dependency order.</text><g font-family="Georgia,serif" fill="#111820"><g font-family="Arial,sans-serif" font-size="19" font-weight="700"><rect x="72" y="230" width="1456" height="54" fill="#e8eef5"/><text x="92" y="264">BUILD THE DECISION</text><text x="844" y="264">RECORD THE COMMERCIAL RESULT</text></g><g font-size="20"><rect x="72" y="284" width="720" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="320" font-weight="700">Business economics</text><text x="92" y="352" fill="#68727c">Current ARR · capacity · MSR · evidence status</text><rect x="72" y="372" width="720" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="408" font-weight="700">Scope Record</text><text x="92" y="440" fill="#68727c">Deliverables · exclusions · responsibilities · dependencies</text><rect x="72" y="460" width="720" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="496" font-weight="700">Whole-Engagement Estimate</text><text x="92" y="528" fill="#68727c">Expected effort · direct costs · confidence · assumptions</text><rect x="72" y="548" width="720" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="584" font-weight="700">Uncertainty response</text><text x="92" y="616" fill="#68727c">Unknown · consequence · treatment · switch trigger</text><rect x="72" y="636" width="720" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="672" font-weight="700">Pricing Model</text><text x="92" y="704" fill="#68727c">Fixed · T&amp;M · capped T&amp;M · discovery · hybrid · recurring</text><rect x="72" y="724" width="720" height="88" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="760" font-weight="700">Project Economic Floor</text><text x="92" y="792" fill="#68727c">Expected total effort × MSR + direct project costs</text><rect x="72" y="812" width="720" height="132" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="848" font-weight="700">Commercial Context</text><text x="92" y="880" fill="#68727c">Capacity · alternatives · delay · proof · procurement</text><text x="92" y="912" fill="#68727c">importance · market plausibility · residual uncertainty</text><rect x="838" y="284" width="690" height="98" fill="#edf5ee" stroke="#a8c0ad"/><text x="858" y="324" font-weight="700">COMMERCIAL PRICE</text><text x="858" y="360" fill="#68727c">Chosen after candidate testing, not by universal markup.</text><rect x="838" y="382" width="690" height="88" fill="#fff" stroke="#ccd3d8"/><text x="858" y="418" font-weight="700">Minimum Engagement decision</text><text x="858" y="450" fill="#68727c">Standing operating threshold kept separate from project floor.</text><rect x="838" y="470" width="690" height="104" fill="#f7f8fa" stroke="#ccd3d8"/><text x="858" y="506" font-weight="700">Commercial boundaries</text><text x="858" y="538" fill="#68727c">Revisions · changes · assumptions · client responsibilities</text><rect x="838" y="574" width="690" height="104" fill="#fff" stroke="#ccd3d8"/><text x="858" y="610" font-weight="700">Payment and recurring structure</text><text x="858" y="642" fill="#68727c">Exposure · progress states · continuing obligation · capacity</text><rect x="838" y="678" width="690" height="132" fill="#f7f8fa" stroke="#ccd3d8"/><text x="858" y="714" font-weight="700">Client-facing summary</text><text x="858" y="746" fill="#68727c">Price · model · scope · assumptions · payment · boundaries</text><text x="858" y="778" fill="#68727c">without exposing internal MSR or Project Economic Floor</text><rect x="838" y="810" width="690" height="176" fill="#fff" stroke="#ccd3d8"/><text x="858" y="846" font-weight="700">After delivery</text><text x="858" y="878" fill="#68727c">Actual effort · meaningful variance · cause</text><text x="858" y="910" fill="#68727c">Realized Revenue per Actual Effort Hour</text><text x="858" y="942" fill="#68727c">smallest supported policy correction · evidence strength</text><rect x="72" y="1036" width="1456" height="236" rx="8" fill="#0b1f33"/><text x="100" y="1088" font-size="25" font-weight="700" fill="#fff">Policy creates consistency in reasoning, not identical outcomes.</text><text x="100" y="1134" font-size="22" fill="#d8dee5">The Personal Pricing Policy supplies standing rules and review triggers.</text><text x="100" y="1176" font-size="22" fill="#d8dee5">The Master Project Pricing Worksheet applies those rules to one opportunity.</text><text x="100" y="1218" font-size="22" fill="#d8dee5">The post-project record creates evidence that can improve the next decision.</text><rect x="72" y="1310" width="1456" height="108" rx="8" fill="#fff8e6" stroke="#d6a72a"/><text x="100" y="1354" font-size="22" font-weight="700">The worksheet is designed to be duplicated for each new material opportunity.</text><text x="100" y="1392" font-size="21">It remains usable even when the correct commercial structure changes from project to project.</text></g></g><text x="72" y="1462" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Current-workbook structure recreated as vector text for a legible product-page proof.</text></svg>