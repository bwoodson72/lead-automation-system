<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500"><rect width="1600" height="1500" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect x="0" y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">FREELANCE DEVELOPER LAUNCH KIT · WORKBOOK LK01 · P. 5</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Launch Operating Specification</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">The one-page destination for the entire 90-day build.</text><rect x="72" y="230" width="1456" height="50" rx="5" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">ALEX MORGAN / SUMMIT AIR &amp; HEAT — COMPLETED MODEL</text><g font-family="Georgia,serif" fill="#111820"><rect x="72" y="305" width="1456" height="116" rx="6" fill="#f3f8f3" stroke="#b8c8ba"/><text x="94" y="340" font-size="21" font-weight="700">Market hypothesis</text><text x="94" y="376" font-size="22">Established regional home-service companies; owner or marketing lead;</text><text x="94" y="406" font-size="22">expansion/campaign trigger.</text><rect x="72" y="438" width="1456" height="116" rx="6" fill="#f3f8f3" stroke="#b8c8ba"/><text x="94" y="473" font-size="21" font-weight="700">Business problem</text><text x="94" y="509" font-size="22">Growth exposes weak service/location structure, vendor dependence,</text><text x="94" y="539" font-size="22">and unclear measurement.</text><rect x="72" y="571" width="1456" height="116" rx="6" fill="#f3f8f3" stroke="#b8c8ba"/><text x="94" y="606" font-size="21" font-weight="700">Offer</text><text x="94" y="642" font-size="22">Lead-Ready Website System: strategy, structure, custom site, forms/CRM,</text><text x="94" y="672" font-size="22">analytics, migration, launch QA, stabilization.</text><rect x="72" y="704" width="1456" height="104" rx="6" fill="#f3f8f3" stroke="#b8c8ba"/><text x="94" y="739" font-size="21" font-weight="700">Pricing policy</text><text x="94" y="775" font-size="22">$4,600 internal floor; $6,500 illustrative starting price; re-scope before discounting.</text><rect x="72" y="825" width="1456" height="104" rx="6" fill="#f3f8f3" stroke="#b8c8ba"/><text x="94" y="860" font-size="21" font-weight="700">Acquisition</text><text x="94" y="896" font-size="22">Primary: qualified direct outreach. Secondary: referrals and agency relationships.</text><rect x="72" y="946" width="1456" height="104" rx="6" fill="#f3f8f3" stroke="#b8c8ba"/><text x="94" y="981" font-size="21" font-weight="700">Sales gate</text><text x="94" y="1017" font-size="22">Problem, desired state, constraints, economics, stakeholders, and next step clear before proposal.</text><rect x="72" y="1067" width="1456" height="104" rx="6" fill="#f3f8f3" stroke="#b8c8ba"/><text x="94" y="1102" font-size="21" font-weight="700">Delivery rules</text><text x="94" y="1138" font-size="22">Signed agreement + initial payment, kickoff, weekly update, change control, launch QA.</text><rect x="72" y="1188" width="1456" height="104" rx="6" fill="#f3f8f3" stroke="#b8c8ba"/><text x="94" y="1223" font-size="21" font-weight="700">Weekly management</text><text x="94" y="1259" font-size="22">Protected sales blocks + pipeline / delivery / cash / capacity / constraint review.</text></g><rect x="72" y="1322" width="1456" height="92" rx="6" fill="#fff8e6" stroke="#d6a72a"/><text x="94" y="1358" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#8b6810">WHY THIS MATTERS</text><text x="94" y="1392" font-family="Georgia,serif" font-size="21" fill="#3e4650">The product gives the reader one connected operating specification instead of eight unrelated freelance tactics.</text><text x="72" y="1460" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>