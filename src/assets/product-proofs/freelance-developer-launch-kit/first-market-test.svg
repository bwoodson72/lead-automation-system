<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340"><rect width="1600" height="1340" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect x="0" y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">FREELANCE DEVELOPER LAUNCH KIT · WORKBOOK LK20 · P. 43</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">First Market Test Log</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Turn the first prospect batch into structured learning.</text><rect x="72" y="230" width="1456" height="50" rx="5" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">ALEX MORGAN / SUMMIT AIR &amp; HEAT — COMPLETED MODEL</text><g font-family="Georgia,serif" fill="#111820"><rect x="72" y="310" width="1456" height="108" rx="7" fill="#f5f7f8" stroke="#cbd2d7"/><text x="96" y="347" font-size="21" font-weight="700">Batch</text><text x="96" y="387" font-size="24">30 qualified home-service companies.</text><rect x="72" y="438" width="1456" height="126" rx="7" fill="#f5f7f8" stroke="#cbd2d7"/><text x="96" y="475" font-size="21" font-weight="700">Message hypothesis</text><text x="96" y="515" font-size="24">Expansion / campaign growth makes location-service structure and publishing control relevant.</text><rect x="72" y="584" width="1456" height="126" rx="7" fill="#edf5ee" stroke="#aac1af"/><text x="96" y="621" font-size="21" font-weight="700">Observed responses</text><text x="96" y="661" font-size="26" font-weight="700" fill="#365f45">8 replies · 4 conversations</text><text x="650" y="661" font-size="24">Strongest interest: vendor frustration + new-location launch.</text><rect x="72" y="730" width="1456" height="126" rx="7" fill="#f5f7f8" stroke="#cbd2d7"/><text x="96" y="767" font-size="21" font-weight="700">Objections heard</text><text x="96" y="807" font-size="24">“We already have an agency” · “Not this quarter” · “Price seems high”</text><rect x="72" y="876" width="1456" height="126" rx="7" fill="#f5f7f8" stroke="#cbd2d7"/><text x="96" y="913" font-size="21" font-weight="700">Buyer language</text><text x="96" y="953" font-size="24">“We need marketing to update pages without waiting on the agency.”</text><rect x="72" y="1022" width="700" height="174" rx="7" fill="#fff8e6" stroke="#d6a72a"/><text x="96" y="1062" font-size="21" font-weight="700">What changed</text><text x="96" y="1104" font-size="23">Lead with control + expansion trigger,</text><text x="96" y="1138" font-size="23">not generic “better website.”</text><rect x="828" y="1022" width="700" height="174" rx="7" fill="#edf5ee" stroke="#aac1af"/><text x="852" y="1062" font-size="21" font-weight="700">What did not change</text><text x="852" y="1104" font-size="23">Do not lower price after one objection;</text><text x="852" y="1138" font-size="23">keep scope and the economic floor.</text></g><text x="72" y="1288" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>