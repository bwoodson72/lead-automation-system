<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="1600" height="1260" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">MARKETING FOR BUILDERS · WORKBOOK P. 20</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Content Job Planner</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Give every marketing asset a buyer question, evidence base, and next useful step.</text><rect x="72" y="230" width="1456" height="50" rx="6" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">FICTIONAL RUNNING EXAMPLE · PROBLEM-RECOGNITION ASSET</text><g font-family="Georgia,serif" fill="#111820"><text x="82" y="340" font-size="21" font-weight="700">BUYER QUESTION</text><text x="420" y="340" font-size="25">Why do people visit our site but fail to request a quote?</text><line x1="72" y1="378" x2="1528" y2="378" stroke="#d7dce0"/><text x="82" y="438" font-size="21" font-weight="700">MARKETING JOB</text><text x="420" y="438" font-size="25">Problem recognition.</text><line x1="72" y1="476" x2="1528" y2="476" stroke="#d7dce0"/><text x="82" y="536" font-size="21" font-weight="700">CORE IDEA</text><text x="420" y="536" font-size="25">Inquiry friction can exist between interest and the contact action.</text><line x1="72" y1="574" x2="1528" y2="574" stroke="#d7dce0"/><text x="82" y="634" font-size="21" font-weight="700">EVIDENCE / EXPERIENCE</text><text x="420" y="634" font-size="23">Audit patterns: competing CTAs, long forms, poor mobile spacing, unclear next-step copy.</text><line x1="72" y1="672" x2="1528" y2="672" stroke="#d7dce0"/><text x="82" y="732" font-size="21" font-weight="700">BEST FORMAT</text><text x="420" y="732" font-size="25">Substantial article with annotated examples.</text><line x1="72" y1="770" x2="1528" y2="770" stroke="#d7dce0"/><text x="82" y="830" font-size="21" font-weight="700">CTA</text><text x="420" y="830" font-size="23">Use a short self-audit or discuss the same problem if it appears on your site.</text><rect x="72" y="900" width="1456" height="190" rx="10" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="950" font-size="22" font-weight="700" fill="#8a6508">WHY THIS IS NOT GENERIC CONTENT</text><text x="100" y="1000" font-size="24">The asset begins with a buyer question and a defined marketing job, then uses actual evidence or experience.</text><text x="100" y="1042" font-size="24">Format and CTA are chosen last, after the useful point is clear.</text></g><text x="72" y="1208" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>