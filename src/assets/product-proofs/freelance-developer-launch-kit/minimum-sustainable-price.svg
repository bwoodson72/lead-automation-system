<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="1600" height="1260" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect x="0" y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">FREELANCE DEVELOPER LAUNCH KIT · WORKBOOK LK09 · P. 21</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Minimum Sustainable Price</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Calculate the internal floor before a commercial quote.</text><rect x="72" y="230" width="1456" height="50" rx="5" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">ALEX MORGAN / SUMMIT AIR &amp; HEAT — COMPLETED MODEL</text><g font-family="Georgia,serif" fill="#111820"><rect x="72" y="315" width="700" height="150" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="98" y="356" font-size="22" font-weight="700">Direct production</text><text x="98" y="415" font-size="40" font-weight="700" fill="#0b1f33">52 hours</text><rect x="828" y="315" width="700" height="150" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="854" y="356" font-size="22" font-weight="700">PM / communication / QA</text><text x="854" y="415" font-size="40" font-weight="700" fill="#0b1f33">17 hours</text><rect x="72" y="493" width="700" height="150" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="98" y="534" font-size="22" font-weight="700">Expected uncertainty / rework</text><text x="98" y="593" font-size="40" font-weight="700" fill="#0b1f33">8 hours</text><rect x="828" y="493" width="700" height="150" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="854" y="534" font-size="22" font-weight="700">Effective burden target</text><text x="854" y="593" font-size="40" font-weight="700" fill="#0b1f33">$60 / hour</text><rect x="72" y="681" width="1456" height="128" rx="8" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="728" font-size="24" font-weight="700">Internal floor</text><text x="100" y="779" font-size="38" font-weight="700" fill="#8a6508">77 × $60 = $4,620 → working floor near $4,600</text><rect x="72" y="837" width="1456" height="128" rx="8" fill="#edf5ee" stroke="#a8c0ad" stroke-width="2"/><text x="100" y="884" font-size="24" font-weight="700">Commercial starting price</text><text x="100" y="935" font-size="38" font-weight="700" fill="#365f45">$6,500 illustrative starting price</text><rect x="72" y="993" width="1456" height="168" rx="8" fill="#f7f8fa" stroke="#ccd3d8"/><text x="100" y="1040" font-size="23" font-weight="700">Decision rule</text><text x="100" y="1083" font-size="23">Below the floor: re-scope, change the pricing model, reduce uncertainty, or decline.</text><text x="100" y="1123" font-size="23">Do not simply accept a project that cannot support the business.</text></g><text x="72" y="1210" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>