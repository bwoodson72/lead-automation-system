<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><rect width="1600" height="1060" fill="#ffffff"/><rect width="1600" height="170" fill="#081523"/><rect y="166" width="1600" height="4" fill="#d6a72a"/><text x="72" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d6a72a">FREELANCE DEVELOPER LAUNCH KIT · WORKSHEET 28 · WORKBOOK P. 72</text><text x="72" y="116" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#ffffff">Weekly Review and Next Constraint</text><text x="72" y="151" font-family="Georgia,serif" font-size="22" fill="#d6dce3">Turn activity into evidence, diagnose the bottleneck, then choose one bounded next action.</text><text x="72" y="220" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#365f45">ALEX MORGAN · END-OF-CYCLE MANAGEMENT RECORD</text><g font-family="Arial,sans-serif"><rect x="72" y="255" width="456" height="172" rx="10" fill="#f6f7f8" stroke="#ccd3d8"/><text x="98" y="298" font-size="18" font-weight="700" fill="#26323d">ACTIVITY</text><text x="98" y="340" font-size="20" fill="#303b45">One client relationship completed.</text><text x="98" y="376" font-size="20" fill="#303b45">Acquisition test + delivery executed.</text><rect x="572" y="255" width="456" height="172" rx="10" fill="#f6f7f8" stroke="#ccd3d8"/><text x="598" y="298" font-size="18" font-weight="700" fill="#26323d">EVIDENCE</text><text x="598" y="340" font-size="20" fill="#303b45">84 h actual vs 77 h estimate.</text><text x="598" y="376" font-size="20" fill="#303b45">Expansion framing produced strongest conversations.</text><rect x="1072" y="255" width="456" height="172" rx="10" fill="#edf5ee" stroke="#a8c0ad"/><text x="1098" y="298" font-size="18" font-weight="700" fill="#365f45">OUTCOME / CURRENT STATE</text><text x="1098" y="340" font-size="20" fill="#303b45">$7,100 collected in fictional case.</text><text x="1098" y="376" font-size="20" fill="#303b45">No next project secured.</text><path d="M528 340 H572 M1028 340 H1072" stroke="#d6a72a" stroke-width="4"/><rect x="72" y="469" width="1456" height="294" rx="10" fill="#f7f8fa" stroke="#ccd3d8"/><text x="100" y="512" font-size="21" font-weight="700" fill="#26323d">Constraint diagnosis</text><text x="100" y="560" font-size="19" font-weight="700" fill="#303b45">Symptom</text><text x="430" y="560" font-size="19" fill="#303b45">Summit is complete, but no next project is secured.</text><line x1="100" y1="584" x2="1500" y2="584" stroke="#e0e4e7"/><text x="100" y="625" font-size="19" font-weight="700" fill="#303b45">Furthest movement</text><text x="430" y="625" font-size="19" fill="#303b45">The system acquired one client that bought a diagnostic and implementation.</text><line x1="100" y1="649" x2="1500" y2="649" stroke="#e0e4e7"/><text x="100" y="690" font-size="19" font-weight="700" fill="#303b45">Current constraint</text><text x="430" y="690" font-size="19" fill="#303b45">New qualified demand / opportunity creation.</text><line x1="100" y1="714" x2="1500" y2="714" stroke="#e0e4e7"/><text x="100" y="750" font-size="19" font-weight="700" fill="#303b45">Competing explanation</text><text x="430" y="750" font-size="19" fill="#303b45">Small sample may not yet separate channel repeatability from timing or noise.</text><rect x="72" y="805" width="1456" height="138" rx="10" fill="#081523"/><text x="100" y="850" font-size="20" font-weight="700" fill="#d6a72a">NEXT BOUNDED ACTION</text><text x="100" y="894" font-size="24" fill="#ffffff">Continue the expansion-trigger acquisition test with stronger Summit proof before adding channels.</text><text x="100" y="924" font-size="18" fill="#d6dce3">Revise coordination assumptions narrowly, but do not let internal process work displace demand generation.</text></g><text x="72" y="1010" font-family="Arial,sans-serif" font-size="16" fill="#77818a">Readable proof excerpt reconstructed from the production-final workbook.</text></svg>