<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1526" viewBox="0 0 1600 1526"><rect width="100%" height="100%" fill="#fff"/><text x="64" y="68" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c79a42">DEVELOPER PROPOSAL &amp; CLOSING KIT  |  WORKBOOK PC02 · P. 5</text><text x="64" y="126" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0b1f33">Proposal Readiness Gate</text><text x="64" y="176" font-family="Georgia, serif" font-size="26" fill="#34495e">Apply the same nine-part gate before spending time on a custom proposal.</text><rect x="64" y="202" width="1472" height="48" rx="4" fill="#edf6ee"/><text x="84" y="233" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#356b45">REDWOOD ROOFING - WORKED EXAMPLE</text><rect x="64" y="260" width="1472" height="76" fill="#0b1f33"/><line x1="444" y1="260" x2="444" y2="336" stroke="#32475a" stroke-width="2"/><text x="82" y="306" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#fff">Prompt / decision</text><text x="462" y="306" font-family="Georgia, serif" font-size="23" font-weight="700" fill="#fff">Worked answer</text><rect x="64" y="336" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="336" x2="444" y2="446" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="370" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Problem clarity</text><text x="462" y="370" font-family="Georgia, serif" font-size="22" fill="#101820">PASS - generic site and weak service-specific proof do not match</text><text x="462" y="400" font-family="Georgia, serif" font-size="22" fill="#101820">Redwood&#x27;s commercial-roofing focus or paid-search paths.</text><rect x="64" y="446" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="446" x2="444" y2="556" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="480" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Desired change</text><text x="462" y="480" font-family="Georgia, serif" font-size="22" fill="#101820">PASS - service-focused site, clearer proof, direct inquiry paths,</text><text x="462" y="510" font-family="Georgia, serif" font-size="22" fill="#101820">maintainable content before storm season.</text><rect x="64" y="556" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="556" x2="444" y2="666" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="590" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Decision authority</text><text x="462" y="590" font-family="Georgia, serif" font-size="22" fill="#101820">PASS - owner approves; marketing manager materially influences content</text><text x="462" y="620" font-family="Georgia, serif" font-size="22" fill="#101820">and review.</text><rect x="64" y="666" width="1472" height="100" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="666" x2="444" y2="766" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="700" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Commercial fit</text><text x="462" y="700" font-family="Georgia, serif" font-size="22" fill="#101820">PASS - an $8,500 project is within the discussed commercial range.</text><rect x="64" y="766" width="1472" height="100" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="766" x2="444" y2="866" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="800" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Timing</text><text x="462" y="800" font-family="Georgia, serif" font-size="22" fill="#101820">PASS - storm-season deadline is tied to a real business window.</text><rect x="64" y="866" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="866" x2="444" y2="976" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="900" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Dependencies</text><text x="462" y="900" font-family="Georgia, serif" font-size="22" fill="#101820">PASS WITH KNOWN INPUTS - content, photography, approvals, hosting/domain</text><text x="462" y="930" font-family="Georgia, serif" font-size="22" fill="#101820">and analytics access have owners/timing.</text><rect x="64" y="976" width="1472" height="100" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="976" x2="444" y2="1076" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1010" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Decision process</text><text x="462" y="1010" font-family="Georgia, serif" font-size="22" fill="#101820">PASS - Tuesday proposal review with owner + marketing manager.</text><rect x="64" y="1076" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="1076" x2="444" y2="1186" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1110" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Risk visibility</text><text x="462" y="1110" font-family="Georgia, serif" font-size="22" fill="#101820">PASS - unverified CRM integration is removed from base scope and offered</text><text x="462" y="1140" font-family="Georgia, serif" font-size="22" fill="#101820">as a separate assessment.</text><rect x="64" y="1186" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="1186" x2="444" y2="1296" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1220" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Mutual effort</text><text x="462" y="1220" font-family="Georgia, serif" font-size="22" fill="#101820">PASS - buyer adds stakeholders, answers scoping questions, and commits</text><text x="462" y="1250" font-family="Georgia, serif" font-size="22" fill="#101820">to a review event.</text><rect x="64" y="1296" width="1472" height="110" fill="#fff" stroke="#c8d0d7" stroke-width="2"/><line x1="444" y1="1296" x2="444" y2="1406" stroke="#c8d0d7" stroke-width="2"/><text x="82" y="1330" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#101820">Overall decision</text><text x="462" y="1330" font-family="Georgia, serif" font-size="22" fill="#101820">PROPOSAL READY - proceed with bounded website proposal; keep CRM as</text><text x="462" y="1360" font-family="Georgia, serif" font-size="22" fill="#101820">optional discovery.</text><text x="64" y="1486" font-family="Arial, sans-serif" font-size="18" fill="#7b8791">Workbook excerpt recreated as vector text for legible product-page preview.</text></svg>