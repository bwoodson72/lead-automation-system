<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Current-edition retainer economics model</title>
  <desc id="desc">Recreated proof panel from the fictional Redwood Roofing case showing modeled recurring burden, direct account cost, observed burden, internal floor, and fictional commercial price.</desc>
  <rect width="1600" height="1080" fill="#ffffff"/>
  <rect width="1600" height="190" fill="#081523"/>
  <rect y="186" width="1600" height="4" fill="#d6a72a"/>
  <text x="72" y="62" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">FREELANCER RETAINER SYSTEM · CURRENT PRODUCTION EDITION</text>
  <text x="72" y="124" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#ffffff">Price the full recurring obligation</text>
  <text x="72" y="164" font-family="Georgia,serif" font-size="23" fill="#d6dce3">Coding time is only one part of what the monthly promise consumes.</text>

  <rect x="72" y="228" width="1456" height="52" rx="6" fill="#edf5ee"/>
  <text x="92" y="262" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">REDWOOD ROOFING — FICTIONAL COMPLETED MODEL</text>

  <g font-family="Georgia,serif" fill="#111820">
    <rect x="72" y="318" width="700" height="142" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/>
    <text x="98" y="360" font-size="22" font-weight="700">Normal modeled burden</text>
    <text x="98" y="414" font-size="34" font-weight="700" fill="#0b1f33">10.75 h + $45</text>
    <text x="98" y="443" font-size="18" fill="#59636d">Business-capacity hours + direct account cost</text>

    <rect x="828" y="318" width="700" height="142" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/>
    <text x="854" y="360" font-size="22" font-weight="700">High-burden modeled period</text>
    <text x="854" y="414" font-size="34" font-weight="700" fill="#0b1f33">14.25 h + $45</text>
    <text x="854" y="443" font-size="18" fill="#59636d">Used for capacity and risk testing</text>

    <rect x="72" y="490" width="700" height="142" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/>
    <text x="98" y="532" font-size="22" font-weight="700">Observed first active period</text>
    <text x="98" y="586" font-size="34" font-weight="700" fill="#0b1f33">11.35 h + $45</text>
    <text x="98" y="615" font-size="18" fill="#59636d">Operating evidence compared with the model</text>

    <rect x="828" y="490" width="700" height="142" rx="8" fill="#fff8e6" stroke="#d6a72a"/>
    <text x="854" y="532" font-size="22" font-weight="700">Vendor-heavy observed period</text>
    <text x="854" y="586" font-size="34" font-weight="700" fill="#8a6508">17.5 h + $45</text>
    <text x="854" y="615" font-size="18" fill="#59636d">Triggers diagnosis; not automatically a new normal</text>

    <rect x="72" y="668" width="700" height="142" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/>
    <text x="98" y="710" font-size="22" font-weight="700">Fictional internal floor</text>
    <text x="98" y="764" font-size="34" font-weight="700" fill="#0b1f33">$150 / capacity hour</text>
    <text x="98" y="793" font-size="18" fill="#59636d">Internal teaching value, not a market benchmark</text>

    <rect x="828" y="668" width="700" height="142" rx="8" fill="#edf5ee" stroke="#a8c0ad"/>
    <text x="854" y="710" font-size="22" font-weight="700">Fictional commercial price</text>
    <text x="854" y="764" font-size="34" font-weight="700" fill="#365f45">$2,650 / month</text>
    <text x="854" y="793" font-size="18" fill="#59636d">Current service carried forward after review</text>
  </g>

  <rect x="72" y="850" width="1456" height="150" rx="8" fill="#081523"/>
  <text x="98" y="894" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#d6a72a">WHAT THE MODEL FORCES YOU TO PRICE</text>
  <text x="98" y="936" font-family="Georgia,serif" font-size="23" fill="#ffffff">Implementation + stewardship + coordination + interruption + direct cost + variability + response burden + real capacity rights.</text>
  <text x="98" y="974" font-family="Georgia,serif" font-size="21" fill="#d6dce3">If the obligation changes materially, the economics must be reopened before the promise changes.</text>

  <text x="72" y="1050" font-family="Arial,sans-serif" font-size="16" fill="#77818a">Recreated from the current production workbook. Fictional teaching values, not customer results or pricing guidance.</text>
</svg>
