<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240"><rect width="100%" height="100%" fill="#fff"/><text x="64" y="68" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#c79a42">DEVELOPER SALES PLAYBOOK  |  WORKBOOK WB C29-X · P. 79</text><text x="64" y="126" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0b1f33">Objection Diagnosis</text><text x="64" y="176" font-family="Georgia, serif" font-size="26" fill="#34495e">The first job is to find out what the buyer is actually objecting to.</text><rect x="64" y="206" width="1472" height="48" rx="6" fill="#edf6ee"/><text x="84" y="237" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#356b45">SUMMIT AIR AND HEAT - WORKED OBJECTION</text><g font-family="Georgia, serif" fill="#101820"><text x="82" y="312" font-size="22" font-weight="700">Buyer exact words</text><text x="430" y="312" font-size="22">“The other proposal is almost $4,000 cheaper.”</text><text x="82" y="382" font-size="22" font-weight="700">Possible meanings</text><text x="430" y="382" font-size="22">Hard budget gap; unclear value; different scope; negotiation attempt;</text><text x="430" y="412" font-size="22">internal approval concern.</text><text x="82" y="492" font-size="22" font-weight="700">Clarifying question</text><text x="430" y="492" font-size="22">“Is $9,200 outside what Summit can approve, or is the issue that the additional</text><text x="430" y="522" font-size="22">value over the $5,400 option is not clear enough?”</text><text x="82" y="602" font-size="22" font-weight="700">Buyer clarification</text><text x="430" y="602" font-size="22">Budget can support it. Eric does not want to pay nearly double “for a prettier website.”</text><text x="82" y="672" font-size="22" font-weight="700">Actual category</text><text x="430" y="672" font-size="22">Comparison / value / scope understanding - not hard affordability.</text><text x="82" y="742" font-size="22" font-weight="700">Response</text><text x="430" y="742" font-size="22">Compare scopes. Make the tradeoff explicit: visual refresh vs. solving publishing,</text><text x="430" y="772" font-size="22">campaign, tracking, and ownership needs.</text><text x="82" y="852" font-size="22" font-weight="700">Next step</text><text x="430" y="852" font-size="22">Eric reviews campaign importance with Maya; follow-up stays tied to a decision event.</text></g><rect x="64" y="912" width="1472" height="180" rx="10" fill="#fff6d8" stroke="#d69e00" stroke-width="2"/><text x="92" y="964" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c78d00">DO NOT STACK ANSWERS</text><text x="92" y="1012" font-family="Georgia, serif" font-size="23" fill="#101820">If you answer price, trust, scope, risk, and timing before you know which one exists,</text><text x="92" y="1046" font-family="Georgia, serif" font-size="23" fill="#101820">you sound defensive and learn nothing.</text><text x="64" y="1176" font-family="Arial, sans-serif" font-size="18" fill="#7b8791">Workbook excerpt recreated as vector text for legible product-page preview.</text></svg>