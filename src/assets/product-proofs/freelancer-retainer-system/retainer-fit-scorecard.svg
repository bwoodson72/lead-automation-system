<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380"><rect width="1600" height="1380" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">FREELANCER RETAINER SYSTEM · WORKBOOK RT01 · P. 3</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Retainer Fit Scorecard</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Decide whether recurring service is commercially justified before you pitch it.</text><rect x="72" y="230" width="1456" height="50" rx="5" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">REDWOOD ROOFING — FICTIONAL COMPLETED MODEL</text><g font-family="Georgia,serif" fill="#111820"><rect x="72" y="315" width="1456" height="110" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="98" y="352" font-size="22" font-weight="700">Recurring need · 2 / 2</text><text x="98" y="392" font-size="21">Monthly campaign, analytics, technical SEO, and site-stewardship needs are visible.</text><rect x="72" y="447" width="1456" height="110" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="98" y="484" font-size="22" font-weight="700">Business importance · 2 / 2</text><text x="98" y="524" font-size="21">The website is a lead-generation channel; continuity and campaign implementation matter.</text><rect x="72" y="579" width="1456" height="110" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="98" y="616" font-size="22" font-weight="700">Boundary potential · 1 / 2</text><text x="98" y="656" font-size="21">Demand varies, but categories and approximate monthly implementation capacity can be bounded.</text><rect x="72" y="711" width="1456" height="110" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="98" y="748" font-size="22" font-weight="700">Relationship quality · 2 / 2</text><text x="98" y="788" font-size="21">Project communication, approvals, and payment were reliable.</text><rect x="72" y="843" width="700" height="110" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="98" y="880" font-size="22" font-weight="700">Economics · 2 / 2</text><text x="98" y="920" font-size="21">A meaningful fee can support the obligation.</text><rect x="828" y="843" width="700" height="110" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="854" y="880" font-size="22" font-weight="700">Capacity fit · 2 / 2</text><text x="854" y="920" font-size="21">Alex can reserve it without harming projects.</text><rect x="72" y="990" width="1456" height="160" rx="8" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="1040" font-size="24" font-weight="700">TOTAL: 11 / 12</text><text x="100" y="1090" font-size="36" font-weight="700" fill="#8a6508">Decision: offer a bounded hybrid</text><text x="100" y="1130" font-size="21">Maintenance + support + reserved growth capacity.</text></g><text x="72" y="1320" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>