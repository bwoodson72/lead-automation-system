<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300"><rect width="1600" height="1300" fill="#fff"/><rect width="1600" height="170" fill="#0a0a0a"/><rect y="166" width="1600" height="4" fill="#d6a13a"/><text x="72" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d6a13a">DEVELOPER MARKETING QUICKSTART WORKBOOK · PP. 13–14</text><text x="72" y="116" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#f4f4f2">First 25 Execution Tracker</text><text x="72" y="148" font-family="Georgia,serif" font-size="21" fill="#c7c7c3">Plan the sequence, run a send-ready preflight, then preserve the evidence.</text><g font-family="Arial,sans-serif"><rect x="72" y="220" width="700" height="370" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/><text x="98" y="262" font-size="18" font-weight="700" fill="#9a641c">PLAN THE SEQUENCE</text><g font-family="Georgia,serif" font-size="21" fill="#111820"><text x="98" y="315"><tspan font-weight="700">Initial:</tspan> verified observation or relevance -> small CTA</text><text x="98" y="365"><tspan font-weight="700">Follow-up 1:</tspan> add useful context or proof</text><text x="98" y="415"><tspan font-weight="700">Final follow-up:</tspan> close the loop cleanly</text><text x="98" y="465"><tspan font-weight="700">Stop rule:</tspan> stop after the planned cadence unless the buyer engages</text><text x="98" y="525">Starting cadence: initial -> 3 to 5 business days -> 5 to 7 business days -> stop</text></g><rect x="828" y="220" width="700" height="370" rx="8" fill="#171717"/><text x="854" y="262" font-size="18" font-weight="700" fill="#d6a13a">SEND-READY PREFLIGHT</text><g font-family="Georgia,serif" font-size="20" fill="#f4f4f2"><text x="854" y="310">✓ sender identity and business contact information</text><text x="854" y="352">✓ clear commercial-solicitation disclosure</text><text x="854" y="394">✓ physical postal address and opt-out process</text><text x="854" y="436">✓ applicable domain and mailbox requirements</text><text x="854" y="478">✓ test message checked for subject, links, signature, address, opt-out</text><text x="854" y="520">✓ prospect entered in the tracker before sending</text></g><rect x="72" y="640" width="1456" height="58" fill="#171717"/><g fill="#f4f4f2" font-size="16" font-weight="700"><text x="88" y="677">DATE</text><text x="180" y="677">PROSPECT</text><text x="410" y="677">MESSAGE</text><text x="610" y="677">RESPONSE</text><text x="810" y="677">EXACT BUYER LANGUAGE</text><text x="1150" y="677">NEXT ACTION</text><text x="1390" y="677">STATUS</text></g><rect x="72" y="698" width="1456" height="155" fill="#fff8e8" stroke="#d9d9d9"/><g font-family="Georgia,serif" font-size="19" fill="#111820"><text x="88" y="745">Day 1</text><text x="180" y="745">Prospect 01</text><text x="410" y="745">Verified observation</text><text x="610" y="745">Reply</text><text x="810" y="745">“What would you change first?”</text><text x="1150" y="745">Send two-point teardown;</text><text x="1150" y="778">ask for short call</text><text x="1390" y="745">Active</text></g><g font-family="Georgia,serif" font-size="20" fill="#555"><rect x="72" y="853" width="1456" height="82" fill="#f7f7f7" stroke="#d9d9d9"/><text x="92" y="905">Rows 1–25 continue below in the production workbook so every response, follow-up, next action, and result has a home.</text></g><rect x="72" y="985" width="1456" height="190" rx="8" fill="#0a0a0a"/><text x="98" y="1028" font-size="18" font-weight="700" fill="#d6a13a">WHAT THIS RECORD PROTECTS</text><g font-family="Georgia,serif" font-size="22" fill="#f4f4f2"><text x="98" y="1072">The tracker preserves exact buyer language, makes open follow-ups visible, and prevents a busy week</text><text x="98" y="1108">from erasing what happened. The first batch is reviewable so a bad assumption can be corrected before</text><text x="98" y="1144">the rest of the First 25 receives the same message.</text></g><text x="72" y="1255" font-family="Arial,sans-serif" font-size="16" fill="#777">Cadence is a Quickstart operating rule, not a legal safe harbor or universal response benchmark.</text></g></svg>