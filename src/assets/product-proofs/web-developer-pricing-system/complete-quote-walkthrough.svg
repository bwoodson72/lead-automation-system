<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1560" viewBox="0 0 1600 1560"><rect width="1600" height="1560" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">WEB DEVELOPER PRICING SYSTEM · CURRENT EDITION</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Northstar End-to-End Decision Chain</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">One fictional opportunity carried from the first pricing question through policy update.</text><g font-family="Georgia,serif" fill="#111820"><rect x="72" y="230" width="1456" height="86" rx="8" fill="#edf5ee"/><text x="98" y="270" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#365f45">NORTHSTAR HEATING &amp; AIR · ILLUSTRATIVE WORKED EXAMPLE</text><text x="98" y="302" font-size="21">The first instinct is about $6,000. The system does not send that number.</text><g font-family="Arial,sans-serif" font-size="18" font-weight="700"><rect x="72" y="354" width="1456" height="54" fill="#e8eef5"/><text x="92" y="388">STEP</text><text x="270" y="388">DECISION</text><text x="1130" y="388">OUTPUT</text></g><g font-size="20"><rect x="72" y="408" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="444" font-weight="700">1</text><text x="270" y="444">Build business economics</text><text x="1130" y="444" font-weight="700">$105 working MSR</text><text x="1130" y="476" font-size="17">$2,500 min engagement</text><rect x="72" y="496" width="1456" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="532" font-weight="700">2</text><text x="270" y="532">Define the Scope Record</text><text x="1130" y="532">Obligation bounded</text><rect x="72" y="584" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="620" font-weight="700">3</text><text x="270" y="620">Estimate the whole engagement</text><text x="1130" y="620" font-weight="700">63 hours + $285</text><rect x="72" y="672" width="1456" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="708" font-weight="700">4</text><text x="270" y="708">Treat the main uncertainty</text><text x="1130" y="708">CRM dependency verified</text><rect x="72" y="760" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="796" font-weight="700">5</text><text x="270" y="796">Choose the Pricing Model</text><text x="1130" y="796">Fixed price fits</text><rect x="72" y="848" width="1456" height="88" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="884" font-weight="700">6</text><text x="270" y="884">Calculate Project Economic Floor</text><text x="1130" y="884" font-weight="700">$6,900</text><rect x="72" y="936" width="1456" height="104" fill="#edf5ee" stroke="#a8c0ad"/><text x="92" y="972" font-weight="700">7</text><text x="270" y="972">Review Commercial Context and test candidates</text><text x="1130" y="972" font-weight="700">$8,500 price</text><text x="1130" y="1004" font-size="17">not a formulaic markup</text><rect x="72" y="1040" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="1076" font-weight="700">8</text><text x="270" y="1076">Set boundaries and payment exposure</text><text x="1130" y="1076">40 / 30 / 30</text><rect x="72" y="1128" width="1456" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="1164" font-weight="700">9</text><text x="270" y="1164">Handle budget pressure without blind discounting</text><text x="1130" y="1164">Change scope or keep price</text><rect x="72" y="1216" width="1456" height="104" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="1252" font-weight="700">10</text><text x="270" y="1252">Compare estimate with actual delivery</text><text x="1130" y="1252" font-weight="700">68 actual hours</text><text x="1130" y="1284" font-size="17">$125 realized revenue / hour</text><rect x="72" y="1320" width="1456" height="88" fill="#edf5ee" stroke="#a8c0ad"/><text x="92" y="1356" font-weight="700">11</text><text x="270" y="1356">Update the Personal Pricing Policy</text><text x="1130" y="1356">2 targeted corrections</text><rect x="72" y="1440" width="1456" height="72" rx="8" fill="#0b1f33"/><text x="100" y="1486" font-size="20" font-weight="700" fill="#fff">Economics → scope → estimate → uncertainty → model → floor → context → price → terms → evidence → policy.</text></g></g><text x="72" y="1536" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Current-edition decision chain recreated as vector text for a legible product-page proof.</text></svg>