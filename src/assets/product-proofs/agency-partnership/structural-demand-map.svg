<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600">
  <rect width="1400" height="1600" fill="#ffffff"/>
  <rect width="1400" height="150" fill="#0a0a0a"/>
  <text x="28" y="55" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#d6a13a">DEVELOPER BUSINESS LAB | AGENCY PARTNERSHIP PLAYBOOK</text>
  <text x="28" y="118" font-family="Arial, sans-serif" font-size="46" font-weight="700" fill="#f4f4f2">AP03 · Ideal Agency Profile and Prospect Qualification</text>
  <text x="1035" y="42" font-family="Arial, sans-serif" font-size="17" fill="#c7c7c3">PRODUCTION-FINAL WORKBOOK EXCERPT</text>

  <rect x="28" y="205" width="1344" height="126" rx="16" fill="#f4f4f2" stroke="#d7d7d3"/>
  <text x="62" y="258" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#171717">Decision before outreach: Pursue, Hold, or Deprioritize?</text>
  <text x="62" y="302" font-family="Arial, sans-serif" font-size="22" fill="#424242">Use current evidence to decide whether an agency is worth contacting. Unknowns stay unknown.</text>

  <text x="28" y="400" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#7a4f13">WORKED EXAMPLE · BRIGHTLINE CREATIVE</text>

  <g font-family="Arial, sans-serif">
    <rect x="28" y="445" width="1344" height="112" rx="12" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="490" font-size="23" font-weight="700" fill="#171717">Responsibility fit</text>
    <text x="435" y="490" font-size="23" fill="#171717">Strong</text>
    <text x="435" y="530" font-size="20" fill="#555555">Repeated marketing-site implementation matches Jordan's delivery responsibility.</text>

    <rect x="28" y="574" width="1344" height="112" rx="12" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="619" font-size="23" font-weight="700" fill="#171717">Repetition evidence</text>
    <text x="435" y="619" font-size="23" fill="#171717">Recent website launches across several client engagements.</text>
    <text x="435" y="659" font-size="20" fill="#555555">Enough to justify attention, not enough to prove current need.</text>

    <rect x="28" y="703" width="1344" height="112" rx="12" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="748" font-size="23" font-weight="700" fill="#171717">Delivery-model plausibility</text>
    <text x="435" y="748" font-size="23" fill="#171717">Plausible outside capacity.</text>
    <text x="435" y="788" font-size="20" fill="#555555">Current staffing arrangement remains unknown.</text>

    <rect x="28" y="832" width="1344" height="112" rx="12" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="877" font-size="23" font-weight="700" fill="#171717">Evidence quality</text>
    <text x="435" y="877" font-size="23" fill="#171717">Moderate</text>
    <text x="435" y="917" font-size="20" fill="#555555">Service and portfolio evidence are strong; internal staffing is not verified.</text>

    <rect x="28" y="961" width="1344" height="112" rx="12" fill="#f7f7f5" stroke="#deded8"/>
    <text x="58" y="1006" font-size="23" font-weight="700" fill="#171717">Route to buyer</text>
    <text x="435" y="1006" font-size="23" fill="#171717">Founder</text>
    <text x="58" y="1047" font-size="23" font-weight="700" fill="#171717">Hard disqualifier</text>
    <text x="435" y="1047" font-size="23" fill="#171717">None observed</text>

    <rect x="28" y="1090" width="1344" height="190" rx="16" fill="#eef4ed" stroke="#bad0b8"/>
    <text x="62" y="1147" font-size="25" font-weight="700" fill="#285b2d">DECISION: PURSUE</text>
    <text x="62" y="1193" font-size="22" fill="#171717">Enough evidence to justify a conversation, not enough evidence to assume a need.</text>
    <text x="62" y="1237" font-size="20" fill="#555555">A Pursue decision means “worth contacting.” It does not mean “safe to partner with.”</text>

    <rect x="28" y="1335" width="1344" height="175" rx="16" fill="#fff7df" stroke="#d6a13a"/>
    <text x="62" y="1390" font-size="23" font-weight="700" fill="#7a4f13">WHY THIS MATTERS</text>
    <text x="62" y="1436" font-size="21" fill="#171717">The playbook separates public evidence from facts that can only be learned in discovery or paid work.</text>
    <text x="62" y="1476" font-size="21" fill="#171717">You contact the agency because the evidence supports a conversation, not because you invented internal pain.</text>
  </g>
</svg>