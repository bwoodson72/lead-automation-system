<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1760" viewBox="0 0 1600 1760"><rect width="100%" height="100%" fill="#fff"/><text x="64" y="70" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#c79a42">CLIENT ACQUISITION WITHOUT UPWORK  |  WORKED EXAMPLE</text><text x="64" y="128" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#0b1f33">Evidence before outreach</text><text x="64" y="190" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#183b5b">6. Problem-signal verification</text><text x="64" y="238" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#101820"><tspan x="64" dy="0">The developer opens the site on mobile and walks the actual inquiry path. The quote form</tspan><tspan x="64" dy="35">requires eleven fields before submission. The phone option is not prominent on the path to</tspan><tspan x="64" dy="35">the form. The facts are saved in the research record.</tspan></text><text x="64" y="370" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#183b5b">7. Trigger verification</text><text x="64" y="418" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#101820"><tspan x="64" dy="0">A recent company announcement says Redwood opened service in a neighboring county. Expansion</tspan><tspan x="64" dy="35">does not prove a redesign is needed, but it increases the relevance of customer acquisition</tspan><tspan x="64" dy="35">and location-specific messaging.</tspan></text><text x="64" y="545" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#183b5b">8. Contact discovery</text><text x="64" y="593" font-family="Georgia, serif" font-size="26" font-weight="400" fill="#101820"><tspan x="64" dy="0">The About page names the owner. LinkedIn corroborates the current role. No verified direct</tspan><tspan x="64" dy="35">email is found, so reachability is scored as 1 rather than 2.</tspan></text><text x="64" y="705" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#183b5b">9. Fit score</text><rect x="64" y="742" width="1410" height="78" fill="#0b1f33" stroke="#20252b" stroke-width="2"/><line x1="514" y1="742" x2="514" y2="820" stroke="#20252b" stroke-width="2"/><line x1="684" y1="742" x2="684" y2="820" stroke="#20252b" stroke-width="2"/><text x="82" y="790" font-family="Georgia, sans-serif" font-size="24" font-weight="700" fill="#fff">Factor</text><text x="532" y="790" font-family="Georgia, sans-serif" font-size="24" font-weight="700" fill="#fff">Score</text><text x="702" y="790" font-family="Georgia, sans-serif" font-size="24" font-weight="700" fill="#fff">Reason</text><rect x="64" y="820" width="1410" height="78" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="514" y1="820" x2="514" y2="898" stroke="#20252b" stroke-width="2"/><line x1="684" y1="820" x2="684" y2="898" stroke="#20252b" stroke-width="2"/><text x="82" y="868" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Market fit</text><text x="532" y="868" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">2</text><text x="702" y="868" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Established home-service company</text><rect x="64" y="898" width="1410" height="78" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="514" y1="898" x2="514" y2="976" stroke="#20252b" stroke-width="2"/><line x1="684" y1="898" x2="684" y2="976" stroke="#20252b" stroke-width="2"/><text x="82" y="946" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Problem evidence</text><text x="532" y="946" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">2</text><text x="702" y="946" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Mobile quote friction verified</text><rect x="64" y="976" width="1410" height="78" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="514" y1="976" x2="514" y2="1054" stroke="#20252b" stroke-width="2"/><line x1="684" y1="976" x2="684" y2="1054" stroke="#20252b" stroke-width="2"/><text x="82" y="1024" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Economic fit</text><text x="532" y="1024" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">2</text><text x="702" y="1024" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Operating scale makes project range plausible</text><rect x="64" y="1054" width="1410" height="78" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="514" y1="1054" x2="514" y2="1132" stroke="#20252b" stroke-width="2"/><line x1="684" y1="1054" x2="684" y2="1132" stroke="#20252b" stroke-width="2"/><text x="82" y="1102" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Urgency</text><text x="532" y="1102" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">2</text><text x="702" y="1102" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Verified service-area expansion</text><rect x="64" y="1132" width="1410" height="78" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="514" y1="1132" x2="514" y2="1210" stroke="#20252b" stroke-width="2"/><line x1="684" y1="1132" x2="684" y2="1210" stroke="#20252b" stroke-width="2"/><text x="82" y="1180" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Reachability</text><text x="532" y="1180" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">1</text><text x="702" y="1180" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Generic email + named owner</text><rect x="64" y="1210" width="1410" height="78" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="514" y1="1210" x2="514" y2="1288" stroke="#20252b" stroke-width="2"/><line x1="684" y1="1210" x2="684" y2="1288" stroke="#20252b" stroke-width="2"/><text x="82" y="1258" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Solution fit</text><text x="532" y="1258" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">2</text><text x="702" y="1240" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#101820"><tspan x="702" dy="0">Offer directly addresses lead-generation</tspan><tspan x="702" dy="25">site structure</tspan></text><rect x="64" y="1288" width="1410" height="78" fill="#fff" stroke="#20252b" stroke-width="2"/><line x1="514" y1="1288" x2="514" y2="1366" stroke="#20252b" stroke-width="2"/><line x1="684" y1="1288" x2="684" y2="1366" stroke="#20252b" stroke-width="2"/><text x="82" y="1336" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Proof fit</text><text x="532" y="1336" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">2</text><text x="702" y="1336" font-family="Georgia, sans-serif" font-size="24" font-weight="400" fill="#101820">Developer has relevant service-business work</text><text x="64" y="1428" font-family="Georgia, sans-serif" font-size="30" font-weight="700" fill="#101820">Total: 13/14 - priority prospect.</text><rect x="64" y="1471" width="1410" height="190" rx="8" fill="#eaf1f7"/><text x="92" y="1513" font-family="Georgia, sans-serif" font-size="24" font-weight="700" fill="#c79a42">REDWOOD RESEARCH RECORD</text><text x="92" y="1555" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#0b1f33"><tspan x="92" dy="0">Verified: expansion, eleven-field mobile quote form, phone option not prominent,</tspan><tspan x="92" dy="27">named owner, published general email.</tspan><tspan x="92" dy="27">Unknown: conversion rate, advertising spend, revenue impact, project budget,</tspan><tspan x="92" dy="27">whether redesign is already planned.</tspan></text></svg>