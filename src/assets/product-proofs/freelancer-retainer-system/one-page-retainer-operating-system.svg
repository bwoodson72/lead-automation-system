y="646" font-size="21">Full obligation priced,</text><text x="854" y="676" font-size="21">not hours alone.</text><rect x="72" y="705" width="700" height="120" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="98" y="742" font-size="22" font-weight="700">Requests</text><text x="98" y="786" font-size="21">One channel; classification</text><text x="98" y="816" font-size="21">before scheduling.</text><rect x="828" y="705" width="700" height="120" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="854" y="742" font-size="22" font-weight="700">Capacity</text><text x="854" y="786" font-size="21">Reserved limit + risk buffer;</text><text x="854" y="816" font-size="21">no unlimited rollover.</text><rect x="72" y="845" width="700" height="120" rx="8" fill="#edf5ee" stroke="#a8c0ad"/><text x="98" y="882" font-size="22" font-weight="700">Value</text><text x="98" y="926" font-size="21">Monthly report connects</text><text x="98" y="956" font-size="21">work to significance.</text><rect x="828" y="845" width="700" height="120" rx="8" fill="#edf5ee" stroke="#a8c0ad"/><text x="854" y="882" font-size="22" font-weight="700">Renewal</text><text x="854" y="936" font-size="30" font-weight="700" fill="#365f45">Evidence-based review</text><rect x="72" y="990" width="1456" height="145" rx="8" fill="#fff8e6" stroke="#d6a72a"/><text x="100" y="1032" font-size="22" font-weight="700">Independence</text><text x="100" y="1082" font-size="28" font-weight="700" fill="#8a6508">Multiple clients · no employee-like control · concentration monitored</text></g><text x="72" y="1405" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>