<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="1600" height="1260" fill="#fff"/><rect width="1600" height="170" fill="#0a0a0a"/><rect y="166" width="1600" height="4" fill="#d6a13a"/><text x="72" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d6a13a">DEVELOPER MARKETING QUICKSTART WORKBOOK · PP. 15–16</text><text x="72" y="116" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#f4f4f2">Diagnostic Review</text><text x="72" y="148" font-family="Georgia,serif" font-size="21" fill="#c7c7c3">Use mechanics, counts, buyer language, and comparison before changing the system.</text><g font-family="Arial,sans-serif"><rect x="72" y="220" width="1456" height="58" fill="#171717"/><g fill="#f4f4f2" font-size="17" font-weight="700"><text x="92" y="258">PASS</text><text x="315" y="258">WHAT YOU INSPECT</text><text x="1010" y="258">WHAT IT CAN TELL YOU</text></g><g font-family="Georgia,serif" font-size="21" fill="#111820"><rect x="72" y="278" width="1456" height="110" fill="#fff" stroke="#d9d9d9"/><text x="92" y="324" font-weight="700">1 · Mechanical</text><text x="315" y="324">Execution, delivery, contact routes, links, booking path</text><text x="1010" y="324">Whether the test actually ran</text><rect x="72" y="388" width="1456" height="110" fill="#f7f7f7" stroke="#d9d9d9"/><text x="92" y="434" font-weight="700">2 · Stage counts</text><text x="315" y="434">Where movement slows or stops</text><text x="1010" y="434">Where to inspect, not why</text><rect x="72" y="498" width="1456" height="110" fill="#fff" stroke="#d9d9d9"/><text x="92" y="544" font-weight="700">3 · Buyer language</text><text x="315" y="544">Objections, corrections, questions, repeated phrases</text><text x="1010" y="544">Which assumption may be weak</text><rect x="72" y="608" width="1456" height="110" fill="#f7f7f7" stroke="#d9d9d9"/><text x="92" y="654" font-weight="700">4 · Comparison</text><text x="315" y="654">Previous batch, stated expectation, changed variable</text><text x="1010" y="654">What to isolate next</text></g><rect x="72" y="765" width="700" height="300" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/><text x="98" y="808" font-size="18" font-weight="700" fill="#9a641c">CONFIDENCE LABELS</text><g font-family="Georgia,serif" font-size="21" fill="#111820"><text x="98" y="858"><tspan font-weight="700">Observation:</tspan> one occurrence; record it</text><text x="98" y="908"><tspan font-weight="700">Signal:</tspan> repeated evidence worth another test</text><text x="98" y="958"><tspan font-weight="700">Pattern:</tspan> repeated enough to justify a larger change</text><text x="98" y="1008"><tspan font-weight="700">Unknown:</tspan> plausible explanations are not yet separated</text></g><rect x="828" y="765" width="700" height="300" rx="8" fill="#171717"/><text x="854" y="808" font-size="18" font-weight="700" fill="#d6a13a">MAYA'S ILLUSTRATIVE READ</text><g font-family="Georgia,serif" font-size="21" fill="#f4f4f2"><text x="854" y="858">25 qualified prospects</text><text x="854" y="898">23 delivered messages</text><text x="854" y="938">4 replies · 1 positive · 1 call · 0 proposals</text><text x="854" y="988">Repeated language: “we already get enough leads”</text><text x="854" y="1028">Next test: change the consequence and outcome, keep buyer and channel stable</text></g><rect x="72" y="1105" width="1456" height="90" rx="8" fill="#fff8e8" stroke="#e0c178"/><text x="98" y="1160" font-family="Georgia,serif" font-size="22" fill="#111820">Do not call the lowest percentage the weakest stage. The First 25 produces signals, not universal benchmarks.</text><text x="72" y="1225" font-family="Arial,sans-serif" font-size="16" fill="#777">Recreated from the production-final workbook and guide for a web-readable proof preview.</text></g></svg>