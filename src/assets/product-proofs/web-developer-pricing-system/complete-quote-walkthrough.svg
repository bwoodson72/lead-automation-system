<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1540" viewBox="0 0 1600 1540"><rect width="1600" height="1540" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">WEB DEVELOPER PRICING SYSTEM · PP. 64–71</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Complete Quote Walkthrough</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">One fictional opportunity carried from the first pricing question through post-project review.</text><g font-family="Georgia,serif" fill="#111820"><rect x="72" y="230" width="1456" height="86" rx="8" fill="#edf5ee"/><text x="98" y="270" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#365f45">NORTHSTAR HEATING &amp; AIR · ILLUSTRATIVE WORKED EXAMPLE</text><text x="98" y="302" font-size="21">Focused lead-generation site · approved copy supplied · one decision-maker · repeatable delivery pattern</text><g font-family="Arial,sans-serif" font-size="18" font-weight="700"><rect x="72" y="354" width="1456" height="54" fill="#e8eef5"/><text x="92" y="388">STEP</text><text x="290" y="388">DECISION</text><text x="1130" y="388">OUTPUT</text></g><g font-size="21"><rect x="72" y="408" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="444" font-weight="700">1</text><text x="290" y="444">Apply business economics</text><text x="1130" y="444" font-weight="700">MSR $105</text><text x="1130" y="476" font-size="18">min project $2,500</text><rect x="72" y="496" width="1456" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="532" font-weight="700">2</text><text x="290" y="532">Define scope + assumptions</text><text x="1130" y="532">Included, excluded, client-owned</text><rect x="72" y="584" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="620" font-weight="700">3</text><text x="290" y="620">Estimate the whole engagement</text><text x="1130" y="620" font-weight="700">63 hours</text><rect x="72" y="672" width="1456" height="88" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="708" font-weight="700">4</text><text x="290" y="708">Calculate project economic floor</text><text x="1130" y="708" font-weight="700">$6,900</text><rect x="72" y="760" width="1456" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="796" font-weight="700">5</text><text x="290" y="796">Review risk + choose model</text><text x="1130" y="796">Fixed price fits</text><rect x="72" y="848" width="1456" height="104" fill="#edf5ee" stroke="#a8c0ad"/><text x="92" y="884" font-weight="700">6</text><text x="290" y="884">Move from floor to commercial price</text><text x="1130" y="884" font-weight="700">$8,500</text><text x="1130" y="918" font-size="18">not a universal markup</text><rect x="72" y="952" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="988" font-weight="700">7</text><text x="290" y="988">Structure payment + boundaries</text><text x="1130" y="988">40 / 30 / 30</text><rect x="72" y="1040" width="1456" height="88" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="1076" font-weight="700">8</text><text x="290" y="1076">Handle budget objection by changing scope</text><text x="1130" y="1076">Do not discount blindly</text><rect x="72" y="1128" width="1456" height="88" fill="#fff" stroke="#ccd3d8"/><text x="92" y="1164" font-weight="700">9</text><text x="290" y="1164">Price the change request before work</text><text x="1130" y="1164">Written approval first</text><rect x="72" y="1216" width="1456" height="88" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="1252" font-weight="700">10</text><text x="290" y="1252">Compare quote with actual delivery</text><text x="1130" y="1252" font-weight="700">68 actual hours</text><text x="1130" y="1284" font-size="18">$125 effective rate</text><rect x="72" y="1304" width="1456" height="88" fill="#edf5ee" stroke="#a8c0ad"/><text x="92" y="1340" font-weight="700">11</text><text x="290" y="1340">Update the pricing policy from variance</text><text x="1130" y="1340">2 targeted fixes</text><rect x="72" y="1426" width="1456" height="72" rx="8" fill="#0b1f33"/><text x="100" y="1472" font-size="21" font-weight="700" fill="#fff">Economics → scope → estimate → floor → risk → model → price → terms → changes → evidence.</text></g></g><text x="72" y="1520" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Walkthrough recreated as vector text for a sharp, legible product-page preview.</text></svg>