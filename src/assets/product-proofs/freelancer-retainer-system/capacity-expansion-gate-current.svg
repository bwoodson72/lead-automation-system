<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">Current-edition capacity expansion gate</title>
  <desc id="desc">Recreated proof panel from the fictional Redwood Roofing case showing why a proposed permanent increase from six to ten planned implementation hours fails the current capacity test.</desc>
  <rect width="1600" height="1080" fill="#ffffff"/>
  <rect width="1600" height="190" fill="#081523"/>
  <rect y="186" width="1600" height="4" fill="#d6a72a"/>
  <text x="72" y="62" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">FREELANCER RETAINER SYSTEM · CURRENT PRODUCTION EDITION</text>
  <text x="72" y="124" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#ffffff">Capacity Expansion Gate</text>
  <text x="72" y="164" font-family="Georgia,serif" font-size="23" fill="#d6dce3">More recurring demand is not automatically safe recurring revenue.</text>

  <rect x="72" y="228" width="1456" height="52" rx="6" fill="#edf5ee"/>
  <text x="92" y="262" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">REDWOOD ROOFING — FICTIONAL EXPANSION TEST</text>

  <g font-family="Georgia,serif" fill="#111820">
    <rect x="72" y="320" width="456" height="160" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/>
    <text x="98" y="362" font-size="21" font-weight="700">Capacity before Redwood</text>
    <text x="98" y="422" font-size="40" font-weight="700" fill="#0b1f33">20.0 h</text>

    <rect x="572" y="320" width="456" height="160" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/>
    <text x="598" y="362" font-size="21" font-weight="700">Current high-burden load</text>
    <text x="598" y="422" font-size="40" font-weight="700" fill="#0b1f33">14.25 h</text>

    <rect x="1072" y="320" width="456" height="160" rx="8" fill="#edf5ee" stroke="#a8c0ad"/>
    <text x="1098" y="362" font-size="21" font-weight="700">Current remainder</text>
    <text x="1098" y="422" font-size="40" font-weight="700" fill="#365f45">5.75 h</text>

    <rect x="72" y="520" width="700" height="172" rx="8" fill="#fff8e6" stroke="#d6a72a"/>
    <text x="98" y="562" font-size="22" font-weight="700">Proposed permanent expansion</text>
    <text x="98" y="608" font-size="24">Six planned hours → ten planned hours</text>
    <text x="98" y="652" font-size="34" font-weight="700" fill="#8a6508">18.25 h modeled load</text>
    <text x="98" y="680" font-size="18" fill="#59636d">Only 1.75 h remains in the monthly envelope</text>

    <rect x="828" y="520" width="700" height="172" rx="8" fill="#fff2f0" stroke="#c56b5a"/>
    <text x="854" y="562" font-size="22" font-weight="700">Peak-period stress test</text>
    <text x="854" y="608" font-size="24">Stressed demand after expansion</text>
    <text x="854" y="652" font-size="34" font-weight="700" fill="#8a3e32">36.5 h demand / 36.0 h usable</text>
    <text x="854" y="680" font-size="18" fill="#59636d">The larger promise fails the peak condition that creates the demand</text>
  </g>

  <rect x="72" y="736" width="1456" height="212" rx="8" fill="#081523"/>
  <text x="98" y="780" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#d6a72a">DECISION</text>
  <text x="98" y="828" font-family="Georgia,serif" font-size="31" font-weight="700" fill="#ffffff">Do not authorize the permanent expansion now.</text>
  <text x="98" y="872" font-family="Georgia,serif" font-size="22" fill="#d6dce3">Keep the six-hour recurring lane. Use separately approved peak-season project blocks when actual capacity exists.</text>
  <text x="98" y="912" font-family="Georgia,serif" font-size="21" fill="#d6dce3">Revisit only when portfolio commitments, real delivery capacity, or operating evidence materially change.</text>

  <text x="72" y="1030" font-family="Arial,sans-serif" font-size="16" fill="#77818a">Recreated from the current production workbook. Fictional teaching example, not a customer result.</text>
</svg>
