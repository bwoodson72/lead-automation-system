<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040"><rect width="1600" height="1040" fill="#ffffff"/><rect width="1600" height="170" fill="#081523"/><rect y="166" width="1600" height="4" fill="#d6a72a"/><text x="72" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d6a72a">FREELANCE DEVELOPER LAUNCH KIT · WORKSHEET 24 · WORKBOOK P. 56</text><text x="72" y="116" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#ffffff">Commercial Decision Record</text><text x="72" y="151" font-family="Georgia,serif" font-size="22" fill="#d6dce3">A proposal assembles understood decisions. It does not replace discovery.</text><text x="72" y="220" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#365f45">SUMMIT AIR &amp; HEAT · PROPOSAL-READINESS EXCERPT</text><g font-family="Arial,sans-serif"><rect x="72" y="255" width="1456" height="360" rx="10" fill="#f7f8fa" stroke="#ccd3d8"/><text x="100" y="298" font-size="20" font-weight="700" fill="#26323d">Readiness item</text><text x="565" y="298" font-size="20" font-weight="700" fill="#26323d">Evidence already established</text><line x1="100" y1="320" x2="1500" y2="320" stroke="#ccd3d8"/><text x="100" y="365" font-size="19" font-weight="700" fill="#303b45">Problem / why now</text><text x="565" y="365" font-size="19" fill="#303b45">Second-office expansion + publishing-control need confirmed by buyer.</text><line x1="100" y1="392" x2="1500" y2="392" stroke="#e0e4e7"/><text x="100" y="437" font-size="19" font-weight="700" fill="#303b45">Desired change</text><text x="565" y="437" font-size="19" fill="#303b45">Two locations represented, bounded editing, inquiry continuity preserved.</text><line x1="100" y1="464" x2="1500" y2="464" stroke="#e0e4e7"/><text x="100" y="509" font-size="19" font-weight="700" fill="#303b45">Material unknowns</text><text x="565" y="509" font-size="19" fill="#303b45">Migration / integration uncertainty resolved through separate paid diagnostic.</text><line x1="100" y1="536" x2="1500" y2="536" stroke="#e0e4e7"/><text x="100" y="581" font-size="19" font-weight="700" fill="#303b45">Decision participants</text><text x="565" y="581" font-size="19" fill="#303b45">Maya represents marketing; Eric is the authorizing owner.</text><rect x="72" y="655" width="700" height="244" rx="10" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="698" font-size="20" font-weight="700" fill="#6c5109">COMMERCIAL DECISION</text><text x="100" y="746" font-size="32" font-weight="700" fill="#8a6508">$6,500 implementation</text><text x="100" y="785" font-size="18" fill="#303b45">Defined obligation, exclusions, responsibilities, acceptance,</text><text x="100" y="815" font-size="18" fill="#303b45">payment schedule and start conditions carried forward.</text><text x="100" y="860" font-size="17" fill="#6b747c">The $600 diagnostic remains a separate paid engagement.</text><rect x="828" y="655" width="700" height="244" rx="10" fill="#edf5ee" stroke="#a8c0ad" stroke-width="2"/><text x="856" y="698" font-size="20" font-weight="700" fill="#365f45">OUTCOME STATE</text><text x="856" y="746" font-size="32" font-weight="700" fill="#365f45">Accepted, then gated to onboarding</text><text x="856" y="785" font-size="18" fill="#303b45">A verbal yes is not production start.</text><text x="856" y="815" font-size="18" fill="#303b45">Agreement, payment and operational start requirements still apply.</text><text x="856" y="860" font-size="17" fill="#52685a">Concerns, re-scope decisions and losses remain explicit records.</text></g><text x="72" y="973" font-family="Arial,sans-serif" font-size="16" fill="#77818a">Readable proof excerpt reconstructed from the production-final workbook.</text></svg>