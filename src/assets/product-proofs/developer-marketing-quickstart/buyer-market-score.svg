<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240"><rect width="1600" height="1240" fill="#fff"/><rect width="1600" height="170" fill="#0a0a0a"/><rect y="166" width="1600" height="4" fill="#d6a13a"/><text x="72" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d6a13a">DEVELOPER MARKETING QUICKSTART WORKBOOK · P. 4</text><text x="72" y="116" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#f4f4f2">Candidate Market Scorecard</text><text x="72" y="148" font-family="Georgia,serif" font-size="21" fill="#c7c7c3">Compare three markets before you commit to one.</text><g font-family="Arial,sans-serif"><rect x="72" y="220" width="1456" height="58" fill="#171717"/><g fill="#f4f4f2" font-size="18" font-weight="700"><text x="92" y="257">CANDIDATE</text><text x="520" y="257">PAIN</text><text x="650" y="257">PAY</text><text x="770" y="257">REACH</text><text x="915" y="257">FREQ.</text><text x="1050" y="257">SPEND</text><text x="1190" y="257">TOTAL</text><text x="1325" y="257">NOTE</text></g><g font-family="Georgia,serif" font-size="21" fill="#111820"><rect x="72" y="278" width="1456" height="122" fill="#fff" stroke="#d9d9d9"/><text x="92" y="326">Independent roofing companies</text><text x="545" y="326">1</text><text x="675" y="326">2</text><text x="805" y="326">2</text><text x="945" y="326">2</text><text x="1090" y="326">2</text><text x="1220" y="326" font-weight="700">9</text><text x="1325" y="326">Chosen</text><text x="92" y="362" font-size="18" fill="#555">Easy to source and inspect; visible customer path.</text><rect x="72" y="400" width="1456" height="122" fill="#f7f7f7" stroke="#d9d9d9"/><text x="92" y="448">Small PPC agencies with reporting workload</text><text x="545" y="448">1</text><text x="675" y="448">2</text><text x="805" y="448">2</text><text x="945" y="448">2</text><text x="1090" y="448">1</text><text x="1220" y="448" font-weight="700">8</text><text x="1325" y="448">Plausible</text><text x="92" y="484" font-size="18" fill="#555">Weaker direct service proof for Maya.</text><rect x="72" y="522" width="1456" height="122" fill="#fff" stroke="#d9d9d9"/><text x="92" y="570">Regional service firms with spreadsheet quoting</text><text x="545" y="570">1</text><text x="675" y="570">2</text><text x="805" y="570">1</text><text x="945" y="570">2</text><text x="1090" y="570">1</text><text x="1220" y="570" font-weight="700">7</text><text x="1325" y="570">Defer</text><text x="92" y="606" font-size="18" fill="#555">Harder to source and inspect quickly.</text></g><rect x="72" y="700" width="1456" height="270" rx="8" fill="#f4f4f2" stroke="#d9d9d9"/><text x="98" y="744" font-size="18" font-weight="700" fill="#9a641c">YOUR DECISION</text><text x="98" y="792" font-family="Georgia,serif" font-size="23" fill="#111820">Chosen buyer: ________________________________________________</text><text x="98" y="842" font-family="Georgia,serif" font-size="23" fill="#111820">Why this group: ______________________________________________</text><text x="98" y="892" font-family="Georgia,serif" font-size="23" fill="#111820">Where I can find 25: __________________________________________</text><text x="98" y="942" font-family="Georgia,serif" font-size="23" fill="#111820">What could prove this choice wrong: ____________________________</text><rect x="72" y="1010" width="1456" height="150" rx="8" fill="#0a0a0a"/><text x="98" y="1052" font-size="18" font-weight="700" fill="#d6a13a">COMPLETION CHECK</text><text x="98" y="1095" font-family="Georgia,serif" font-size="22" fill="#f4f4f2">Name one buyer, show why you chose it over two alternatives, and show where at least 25</text><text x="98" y="1130" font-family="Georgia,serif" font-size="22" fill="#f4f4f2">real examples can be found. The score is a working heuristic, not proof of demand.</text></g><text x="72" y="1206" font-family="Arial,sans-serif" font-size="16" fill="#777">Recreated from the production-final workbook for a web-readable proof preview.</text></svg>