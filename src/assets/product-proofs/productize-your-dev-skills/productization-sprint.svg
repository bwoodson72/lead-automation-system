<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1380" viewBox="0 0 1600 1380"><rect width="1600" height="1380" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">PRODUCTIZE YOUR DEV SKILLS · P. 63</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">30-Day Productization Sprint</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Move from vague capability to a tested offer with real market feedback.</text><g font-family="Georgia,serif" fill="#111820"><rect x="72" y="230" width="1456" height="86" rx="8" fill="#edf5ee"/><text x="98" y="268" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#365f45">SPRINT OUTPUT</text><text x="98" y="300" font-size="22">One offer candidate · one minimum offer page · 25–50 qualified test prospects · documented feedback</text><g font-family="Arial,sans-serif" font-size="18" font-weight="700"><rect x="72" y="352" width="1456" height="54" fill="#e8eef5"/><text x="92" y="386">DAYS</text><text x="255" y="386">FOCUS</text><text x="710" y="386">OUTPUT</text></g><g font-size="21"><rect x="72" y="406" width="1456" height="96" fill="#fff" stroke="#ccd3d8"/><text x="92" y="444" font-weight="700">1–3</text><text x="255" y="444">Capability inventory</text><text x="710" y="444">Skills, domain knowledge, process knowledge, repeated work</text><rect x="72" y="502" width="1456" height="96" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="540" font-weight="700">4–7</text><text x="255" y="540">Buyer / problem research</text><text x="710" y="540">Three candidate markets + evidence of recurring problems</text><rect x="72" y="598" width="1456" height="96" fill="#fff" stroke="#ccd3d8"/><text x="92" y="636" font-weight="700">8–10</text><text x="255" y="636">Opportunity scoring</text><text x="710" y="636">One primary candidate + uncertainty decision</text><rect x="72" y="694" width="1456" height="96" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="732" font-weight="700">11–14</text><text x="255" y="732">Offer design</text><text x="710" y="732">Outcome · deliverables · qualification · scope · process · add-ons</text><rect x="72" y="790" width="1456" height="96" fill="#fff" stroke="#ccd3d8"/><text x="92" y="828" font-weight="700">15–17</text><text x="255" y="828">Positioning</text><text x="710" y="828">Name · positioning statement · one-sentence pitch</text><rect x="72" y="886" width="1456" height="96" fill="#f7f8fa" stroke="#ccd3d8"/><text x="92" y="924" font-weight="700">18–20</text><text x="255" y="924">Proof</text><text x="710" y="924">Relevant sample · demo · diagnostic · artifact · case material</text><rect x="72" y="982" width="1456" height="96" fill="#fff" stroke="#ccd3d8"/><text x="92" y="1020" font-weight="700">21–23</text><text x="255" y="1020">Minimum offer page</text><text x="710" y="1020">Clear page or document with one CTA</text><rect x="72" y="1078" width="1456" height="96" fill="#fff8e6" stroke="#d6a72a"/><text x="92" y="1116" font-weight="700">24–30</text><text x="255" y="1116">Market test</text><text x="710" y="1116">25–50 qualified prospects + documented feedback</text><rect x="72" y="1210" width="1456" height="86" rx="8" fill="#0b1f33"/><text x="100" y="1263" font-size="22" font-weight="700" fill="#ffffff">Operating rule: change the offer only when patterns emerge from qualified-buyer evidence.</text></g></g><text x="72" y="1336" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Guide excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>