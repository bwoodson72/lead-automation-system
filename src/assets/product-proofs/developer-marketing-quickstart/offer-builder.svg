<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320"><rect width="1600" height="1320" fill="#fff"/><rect width="1600" height="170" fill="#0a0a0a"/><rect y="166" width="1600" height="4" fill="#d6a13a"/><text x="72" y="58" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#d6a13a">DEVELOPER MARKETING QUICKSTART WORKBOOK · P. 7</text><text x="72" y="116" font-family="Arial,sans-serif" font-size="46" font-weight="700" fill="#f4f4f2">Offer Builder</text><text x="72" y="148" font-family="Georgia,serif" font-size="21" fill="#c7c7c3">Make the offer buyable, then derive a provisional price you can explain.</text><g font-family="Arial,sans-serif"><rect x="72" y="220" width="700" height="535" rx="8" fill="#f7f7f7" stroke="#d9d9d9"/><text x="98" y="260" font-size="18" font-weight="700" fill="#9a641c">OFFER</text><g font-family="Georgia,serif" font-size="21" fill="#111820"><text x="98" y="310"><tspan font-weight="700">Buyer:</tspan> Independent roofing companies</text><text x="98" y="355"><tspan font-weight="700">Outcome:</tspan> clearer path to a qualified estimate request</text><text x="98" y="400"><tspan font-weight="700">Mechanism:</tspan> service clarity, proof, estimate flow, mobile UX</text><text x="98" y="445"><tspan font-weight="700">Scope:</tspan> defined pages, proof, estimate path, analytics, QA, launch</text><text x="98" y="490"><tspan font-weight="700">Proof:</tspan> relevant portfolio + prospect-specific teardown</text><text x="98" y="535"><tspan font-weight="700">Risk reduction:</tspan> clear acceptance + staged discovery when needed</text><text x="98" y="580"><tspan font-weight="700">Next step:</tspan> short conversation or permission to send two changes</text></g><rect x="828" y="220" width="700" height="535" rx="8" fill="#171717"/><text x="854" y="260" font-size="18" font-weight="700" fill="#d6a13a">QUICKSTART ECONOMIC FLOOR</text><g font-family="Georgia,serif" font-size="22" fill="#f4f4f2"><text x="854" y="315">Required owner income</text><text x="1370" y="315" text-anchor="end">$75,000</text><text x="854" y="360">Annual business overhead</text><text x="1370" y="360" text-anchor="end">$15,000</text><text x="854" y="405">Reserve / non-billable burden</text><text x="1370" y="405" text-anchor="end">$10,000</text><line x1="854" y1="432" x2="1450" y2="432" stroke="#555"/><text x="854" y="475" font-weight="700">Required annual business revenue</text><text x="1450" y="475" text-anchor="end" font-weight="700">$100,000</text><text x="854" y="525">Realistic annual delivery hours</text><text x="1450" y="525" text-anchor="end">1,000</text><line x1="854" y1="552" x2="1450" y2="552" stroke="#d6a13a"/><text x="854" y="600" font-weight="700">Minimum effective delivery-hour floor</text><text x="1450" y="600" text-anchor="end" font-weight="700" fill="#f5c75b">$100</text><text x="854" y="655">50-hour project floor</text><text x="1450" y="655" text-anchor="end">$5,000</text><text x="854" y="700">Costs / contingency</text><text x="1450" y="700" text-anchor="end">$500</text></g><rect x="72" y="805" width="1456" height="250" rx="8" fill="#fff8e8" stroke="#e0c178"/><text x="98" y="850" font-size="18" font-weight="700" fill="#9a641c">FICTIONAL PROVISIONAL QUOTE</text><text x="98" y="915" font-family="Arial,sans-serif" font-size="54" font-weight="700" fill="#111820">$6,000 fixed scope</text><text x="98" y="965" font-family="Georgia,serif" font-size="22" fill="#333">Paid discovery or re-scoping when requirements are materially uncertain.</text><text x="98" y="1010" font-family="Georgia,serif" font-size="20" fill="#555">The $100 floor and $6,000 quote demonstrate the method. They are not recommended market rates.</text><rect x="72" y="1095" width="1456" height="145" rx="8" fill="#0a0a0a"/><text x="98" y="1138" font-size="18" font-weight="700" fill="#d6a13a">COMPLETION CHECK</text><text x="98" y="1182" font-family="Georgia,serif" font-size="22" fill="#f4f4f2">A buyer can understand the change, scope, provisional price or rule, proof, risk reduction,</text><text x="98" y="1217" font-family="Georgia,serif" font-size="22" fill="#f4f4f2">and next step. You can show where the economic floor came from and what triggers re-scoping.</text></g><text x="72" y="1284" font-family="Arial,sans-serif" font-size="16" fill="#777">Recreated from the production-final workbook for a web-readable proof preview.</text></svg>