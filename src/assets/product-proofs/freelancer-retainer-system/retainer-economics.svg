<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="1600" height="1260" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">FREELANCER RETAINER SYSTEM · WORKBOOK RT10 · P. 21</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">Retainer Economics Worksheet</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Price the whole obligation, not only expected coding time.</text><rect x="72" y="230" width="1456" height="50" rx="5" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">REDWOOD ROOFING — FICTIONAL COMPLETED MODEL</text><g font-family="Georgia,serif" fill="#111820"><rect x="72" y="315" width="700" height="155" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="98" y="356" font-size="22" font-weight="700">Expected delivery</text><text x="98" y="410" font-size="30" font-weight="700" fill="#0b1f33">8–10h planned + ~1h stewardship</text><rect x="828" y="315" width="700" height="155" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="854" y="356" font-size="22" font-weight="700">Coordination</text><text x="854" y="410" font-size="30" font-weight="700" fill="#0b1f33">~1.5h monthly</text><rect x="72" y="498" width="700" height="155" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="98" y="539" font-size="22" font-weight="700">Interruption burden</text><text x="98" y="584" font-size="21">Support creates context switching even when</text><text x="98" y="619" font-size="21">incident hours remain low.</text><rect x="828" y="498" width="700" height="155" rx="8" fill="#f5f7f8" stroke="#ccd3d8"/><text x="854" y="539" font-size="22" font-weight="700">Reserved capacity value</text><text x="854" y="584" font-size="21">Capacity is kept available instead of sold</text><text x="854" y="619" font-size="21">to another project.</text><rect x="72" y="690" width="1456" height="128" rx="8" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="737" font-size="24" font-weight="700">Internal floor</text><text x="100" y="788" font-size="38" font-weight="700" fill="#8a6508">Approximately $2,050 before profit / risk margin</text><rect x="72" y="846" width="1456" height="128" rx="8" fill="#edf5ee" stroke="#a8c0ad" stroke-width="2"/><text x="100" y="893" font-size="24" font-weight="700">Commercial price</text><text x="100" y="944" font-size="38" font-weight="700" fill="#365f45">$2,600 / month — illustrative, not a market benchmark</text></g><text x="72" y="1210" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>