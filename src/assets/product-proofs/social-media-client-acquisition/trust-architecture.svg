<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1260" viewBox="0 0 1600 1260"><rect width="1600" height="1260" fill="#fff"/><rect width="1600" height="190" fill="#081523"/><rect y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">SOCIAL MEDIA CLIENT ACQUISITION · WORKSHEET 8</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#fff">Trust Architecture Audit</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Find where the buyer's confidence breaks between a post, profile, proof, website, and conversation.</text><rect x="72" y="230" width="1456" height="50" rx="6" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">SEVEN TRUST LAYERS</text><g font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0b1f33"><rect x="90" y="355" width="300" height="94" rx="12" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="240" y="412" text-anchor="middle">1 · POSITIONING</text><rect x="460" y="355" width="300" height="94" rx="12" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="610" y="412" text-anchor="middle">2 · PROFILE</text><rect x="830" y="355" width="300" height="94" rx="12" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="980" y="412" text-anchor="middle">3 · PROOF</text><rect x="1200" y="355" width="300" height="94" rx="12" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="1350" y="412" text-anchor="middle">4 · JUDGMENT</text><rect x="275" y="520" width="300" height="94" rx="12" fill="#f5f7f8" stroke="#ccd3d8"/><text x="425" y="577" text-anchor="middle">5 · PROCESS</text><rect x="650" y="520" width="300" height="94" rx="12" fill="#f5f7f8" stroke="#ccd3d8"/><text x="800" y="577" text-anchor="middle">6 · OWNED DESTINATION</text><rect x="1025" y="520" width="300" height="94" rx="12" fill="#f5f7f8" stroke="#ccd3d8"/><text x="1175" y="577" text-anchor="middle">7 · REPUTATION</text></g><g font-family="Georgia,serif" fill="#111820"><text x="82" y="715" font-size="25" font-weight="700">Common contradiction points</text><text x="90" y="765" font-size="22">• Profile says specialist; website still presents a generic developer.</text><text x="90" y="807" font-size="22">• Content demonstrates judgment; portfolio shows screenshots with no context.</text><text x="90" y="849" font-size="22">• Premium positioning; broken links, stale proof, or vague next step.</text><text x="90" y="891" font-size="22">• Helpful public presence; aggressive private outreach creates distrust.</text><rect x="72" y="960" width="1456" height="150" rx="10" fill="#fff8e6" stroke="#d6a72a" stroke-width="2"/><text x="100" y="1010" font-size="22" font-weight="700" fill="#8a6508">REPAIR ORDER</text><text x="100" y="1055" font-size="23">Fix the highest-commercial-risk contradiction first. A stronger post cannot compensate for a profile, proof surface,</text><text x="100" y="1093" font-size="23">or website that gives the buyer a reason to doubt what the post just implied.</text></g><text x="72" y="1208" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook framework recreated as vector text for a sharp, legible product-page preview.</text></svg>