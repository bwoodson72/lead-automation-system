<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500"><rect width="1600" height="1500" fill="#ffffff"/><rect width="1600" height="190" fill="#081523"/><rect x="0" y="186" width="1600" height="4" fill="#d6a72a"/><text x="72" y="64" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#d6a72a">FREELANCE DEVELOPER LAUNCH KIT · WORKBOOK LK39 · P. 81</text><text x="72" y="126" font-family="Arial,sans-serif" font-size="48" font-weight="700" fill="#ffffff">90-Day Phase Gate Tracker</text><text x="72" y="166" font-family="Georgia,serif" font-size="24" fill="#d6dce3">Use each gate to prove operating capability rather than assume the calendar guarantees sales.</text><rect x="72" y="230" width="1456" height="50" rx="5" fill="#edf5ee"/><text x="92" y="263" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#365f45">ALEX MORGAN / SUMMIT AIR &amp; HEAT — COMPLETED MODEL</text><line x1="176" y1="330" x2="176" y2="1325" stroke="#d6a72a" stroke-width="5"/><g font-family="Arial,sans-serif"><circle cx="176" cy="360" r="28" fill="#081523"/><text x="154" y="368" font-size="17" font-weight="700" fill="#ffffff">10</text><text x="235" y="350" font-size="23" font-weight="700" fill="#0b1f33">DAY 10</text><text x="235" y="388" font-family="Georgia,serif" font-size="23" fill="#263746">Commercial hypothesis defined: buyer, problem, offer, boundaries, starting price territory, evidence rule.</text><circle cx="176" cy="510" r="28" fill="#081523"/><text x="154" y="518" font-size="17" font-weight="700" fill="#ffffff">20</text><text x="235" y="500" font-size="23" font-weight="700" fill="#0b1f33">DAY 20</text><text x="235" y="538" font-family="Georgia,serif" font-size="23" fill="#263746">Minimum proof and presence published; claims supported and the contact path works.</text><circle cx="176" cy="660" r="28" fill="#081523"/><text x="154" y="668" font-size="17" font-weight="700" fill="#ffffff">30</text><text x="235" y="650" font-size="23" font-weight="700" fill="#0b1f33">DAY 30</text><text x="235" y="688" font-family="Georgia,serif" font-size="23" fill="#263746">Transaction-ready: agreement/payment path, CRM, money workflow, onboarding, runway, outbound readiness.</text><circle cx="176" cy="810" r="28" fill="#081523"/><text x="154" y="818" font-size="17" font-weight="700" fill="#ffffff">45</text><text x="235" y="800" font-size="23" font-weight="700" fill="#0b1f33">DAY 45</text><text x="235" y="838" font-family="Georgia,serif" font-size="23" fill="#263746">First market test produced enough qualified contact to inspect targeting, message, proof, and deliverability.</text><circle cx="176" cy="960" r="28" fill="#081523"/><text x="154" y="968" font-size="17" font-weight="700" fill="#ffffff">60</text><text x="235" y="950" font-size="23" font-weight="700" fill="#0b1f33">DAY 60</text><text x="235" y="988" font-family="Georgia,serif" font-size="23" fill="#263746">Qualified conversations are happening—or the evidence identifies the constraint preventing them.</text><circle cx="176" cy="1110" r="28" fill="#081523"/><text x="154" y="1118" font-size="17" font-weight="700" fill="#ffffff">75</text><text x="235" y="1100" font-size="23" font-weight="700" fill="#0b1f33">DAY 75</text><text x="235" y="1138" font-family="Georgia,serif" font-size="23" fill="#263746">Qualified opportunities have proposal-readiness and decision paths; acquisition still continues.</text><circle cx="176" cy="1260" r="30" fill="#365f45"/><text x="151" y="1268" font-size="17" font-weight="700" fill="#ffffff">90</text><text x="235" y="1250" font-size="23" font-weight="700" fill="#365f45">DAY 90</text><text x="235" y="1288" font-family="Georgia,serif" font-size="23" fill="#263746">Operating system reviewed from evidence; binding constraint and next system to deepen are named.</text></g><rect x="72" y="1360" width="1456" height="72" rx="7" fill="#fff8e6" stroke="#d6a72a"/><text x="96" y="1405" font-family="Georgia,serif" font-size="22" fill="#5e4a12">The clock is a sequence of capability gates—not a promise that revenue appears on a schedule.</text><text x="72" y="1470" font-family="Arial,sans-serif" font-size="17" fill="#77818a">Workbook excerpt recreated as vector text for a sharp, legible product-page preview.</text></svg>